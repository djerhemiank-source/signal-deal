<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>Signal Deal — Retirer une demande de travaux</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07101f;--panel:#101a2f;--line:#2a3b5e;--text:#f1f5ff;--muted:#9eb0cf;--a:#68d5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:32px 20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}h1{line-height:1.15}p{color:var(--muted);line-height:1.6}label{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px}input{width:100%;background:#081326;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}.btn,button{display:inline-block;margin-top:14px;border:1px solid var(--a);background:var(--a);color:#04121c;padding:10px 13px;border-radius:10px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.back{background:#13233e;border-color:var(--line);color:var(--text);margin-right:7px}.msg{margin-top:12px;font-size:12px;line-height:1.5}</style></head><body><main class="wrap"><a class="btn back" href="./demande-travaux.html">← Retour</a><div class="card"><h1>Retirer une demande de travaux</h1><p>Entrez la référence affichée lors du dépôt de votre projet et l’adresse e-mail utilisée. Si les informations correspondent, la demande et les coordonnées associées seront supprimées.</p><label>Référence de la demande</label><input id="reference" placeholder="Ex. A1B2C3D4E5"><label>Adresse e-mail</label><input id="email" type="email" placeholder="vous@email.fr"><button id="submitBtn" onclick="withdraw()">Supprimer ma demande</button><div id="msg" class="msg"></div></div></main><script>const client=window.supabase.createClient('https://eazukvtjxeirbitukueb.supabase.co','sb_publishable_OIOSgs39cGT6s34eVuexIA_5bZGmZVj');async function withdraw(){const btn=document.getElementById('submitBtn'),msg=document.getElementById('msg'),reference=document.getElementById('reference').value.trim(),email=document.getElementById('email').value.trim();if(!reference||!email){msg.textContent='Saisissez la référence et votre e-mail.';return}btn.disabled=true;btn.textContent='Suppression…';try{const {data,error}=await client.functions.invoke('signal-deal-withdraw-work-request',{body:{reference,email}});if(error)throw error;msg.textContent=data?.message||'La demande a été retirée.';btn.textContent='Demande retirée'}catch(e){console.error(e);btn.disabled=false;btn.textContent='Supprimer ma demande';msg.textContent='Impossible de traiter la demande pour le moment. Réessayez plus tard.'}}</script></body></html>
