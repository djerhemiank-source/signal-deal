<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZoneProspect 360° — Mes cibles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Inter,system-ui;background:#07101f;color:#f1f5ff}.wrap{max-width:1150px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn,button,input,select{font:inherit}.btn,button{display:inline-block;background:#13233e;color:#fff;border:1px solid #2a3b5e;padding:9px 12px;border-radius:10px;text-decoration:none;cursor:pointer}.panel,.card{background:#101a2f;border:1px solid #2a3b5e;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.score{font-size:26px;font-weight:900;color:#68d5ff}.muted{color:#9eb0cf;font-size:12px;line-height:1.5}.tag{display:inline-block;padding:4px 7px;border:1px solid #355271;border-radius:999px;font-size:10px;margin:3px}.mode{display:inline-block;margin:5px 0 8px;padding:5px 8px;border-radius:999px;background:#0d2a3a;border:1px solid #37647e;font-size:10px;color:#cdefff}.reason{background:#0b1830;border-left:3px solid #68d5ff;padding:8px;border-radius:7px;margin:6px 0;font-size:11px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.fact{border:1px solid #263b5b;border-radius:8px;padding:7px;font-size:10px}.breakdown{margin-top:10px;border-top:1px solid #253957;padding-top:8px}.point{display:flex;justify-content:space-between;gap:10px;font-size:10px;padding:4px 0;color:#c5d1e4}.point b{color:#9ff0c6}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}.filters input,.filters select{background:#081326;color:#fff;border:1px solid #2a3b5e;border-radius:9px;padding:10px}.empty{padding:30px;text-align:center;color:#9eb0cf}@media(max-width:760px){.grid,.facts,.filters{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>🎯 Mes cibles ZoneProspect 360°</h1><div><a class="btn" href="./compte.html">Mon compte</a> <a class="btn" href="./profil-foyer.html">Ma fiche foyer</a> <a class="btn" href="./ciblage-pro.html">Mon client idéal</a></div></div><div class="panel"><div id="title">Analyse de vos correspondances…</div><div id="notice" class="muted"></div></div><div class="panel"><div class="filters"><input id="filterText" placeholder="Filtrer par mot-clé, ville, projet…"><select id="minScore"><option value="0">Tous les scores</option><option value="50">50 % et +</option><option value="70">70 % et +</option><option value="85">85 % et +</option></select><select id="modeFilter"><option value="all">Tous les matchings</option><option value="client_ideal">Client idéal</option><option value="metier_automatique">Automatique métier</option></select><button onclick="render()">Filtrer</button></div></div><div id="grid" class="grid"></div></div><script>const U='https://eazukvtjxeirbitukueb.supabase.co',K='sb_publishable_OIOSgs39cGT6s34eVuexIA_5bZGmZVj',c=window.supabase.createClient(U,K),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let all=[];function fact(a,b){return b!==null&&b!==undefined&&b!==''?`<div class="fact"><b>${esc(a)}</b><br>${esc(Array.isArray(b)?b.join(', '):b)}</div>`:''}function breakdown(x){const a=x.score_breakdown||[];return a.length?`<div class="breakdown"><div class="muted"><b>Détail du score</b></div>${a.map(z=>`<div class="point"><span>${esc(z.label)}</span><b>+${esc(z.points)}</b></div>`).join('')}</div>`:''}function textOf(x){return JSON.stringify(x).toLowerCase()}function render(){const q=document.getElementById('filterText').value.trim().toLowerCase(),min=Number(document.getElementById('minScore').value)||0,mf=document.getElementById('modeFilter').value;const items=all.filter(x=>x.score>=min&&(!q||textOf(x).includes(q))&&(mf==='all'||x.targeting_mode===mf||x.type==='professional'&&mf==='all'));const g=document.getElementById('grid');if(!items.length){g.innerHTML='<div class="empty">Aucune cible ne correspond à ces filtres.</div>';return}g.innerHTML=items.map(x=>{const rs=(x.reasons||[]).map(r=>`<div class="reason">✓ ${esc(r)}</div>`).join('');if(x.type==='professional')return `<article class="card"><div class="score">${esc(x.score)} %</div><span class="mode">Professionnel recommandé</span><h2>${esc(x.label)}</h2><div class="muted">${esc(x.profession||'Professionnel')} · ${esc(x.postal_code||'')} ${esc(x.city||'')}</div>${rs}${breakdown(x)}<div>${(x.specialties||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p>${x.contact?.email?`<a class="btn" href="mailto:${encodeURIComponent(x.contact.email)}">✉ Écrire</a> `:''}${x.contact?.phone?`<a class="btn" href="tel:${esc(x.contact.phone)}">☎ Appeler</a> `:''}${x.website?`<a class="btn" target="_blank" rel="noopener" href="${esc(x.website)}">Site web</a>`:''}</p></article>`;const p=x.profile||{},mode=x.targeting_mode==='client_ideal'?'🎯 Matching client idéal':'⚙️ Matching automatique métier';return `<article class="card"><div class="score">${esc(x.score)} %</div><span class="mode">${mode}</span><h2>${esc(x.label||'Particulier ZoneProspect')}</h2><div class="muted">📍 ${esc(x.postal_code||'')} ${esc(x.city||'')}</div>${rs}${breakdown(x)}<div class="facts">${fact('Civilité',p.civility)}${fact('Tranche d’âge adulte',p.adult_age_band)}${fact('Foyer',p.household_size?`${p.household_size} personne(s)`:null)}${fact('Enfants',p.children_count)}${fact('Âges enfants',p.children_age_bands)}${fact('Animaux',p.pets)}${fact('Logement',p.housing_type)}${fact('Situation logement',p.housing_status)}${fact('Jardin',p.has_garden?'Oui':null)}${fact('Centres d’intérêt',p.interests)}${fact('Offres recherchées',p.shopping_interests)}${fact('Projets',p.project_interests)}</div>${x.contact?.phone?`<p><a class="btn" href="tel:${esc(x.contact.phone)}">☎ Contacter par téléphone</a></p>`:'<p class="muted">Coordonnées non disponibles ou non autorisées.</p>'}</article>`}).join('')}async function init(){const {data:s}=await c.auth.getSession();if(!s.session){document.getElementById('title').innerHTML='Connexion nécessaire — <a class="btn" href="./#authSection">Se connecter</a>';return}const {data,error}=await c.functions.invoke('zoneprospect360-matching',{body:{limit:100}});if(error||data?.error){document.getElementById('title').textContent='Impossible de calculer les cibles pour le moment.';return}all=data.items||[];document.getElementById('title').textContent=data.mode==='professional_to_particular'?'Prospects particuliers correspondant à votre activité':'Professionnels correspondant à votre profil';document.getElementById('notice').textContent=(data.targeting_active?'Votre client idéal personnalisé est actif. ':'')+(data.notice||`${all.length} correspondance(s) trouvée(s).`);render()}init();</script></body></html>
