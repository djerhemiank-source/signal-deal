iculier ZoneProspect')}</h2><div class="muted">📍 ${esc(x.postal_code||'')} ${esc(x.city||'')}</div>${rs}<div class="facts">${fact('Civilité',p.civility)}${fact('Tranche d’âge adulte',p.adult_age_band)}${fact('Foyer',p.household_size?`${p.household_size} personne(s)`:null)}${fact('Enfants',p.children_count)}${fact('Âges enfants',p.children_age_bands)}${fact('Animaux',p.pets)}${fact('Logement',p.housing_type)}${fact('Situation logement',p.housing_status)}${fact('Jardin',p.has_garden?'Oui':null)}${fact('Centres d’intérêt',p.interests)}${fact('Offres recherchées',p.shopping_interests)}${fact('Projets',p.project_interests)}</div>${x.contact?.phone?`<p><a class="btn" href="tel:${esc(x.contact.phone)}">☎ Contacter par téléphone</a></p>`:'<p class="muted">Coordonnées non disponibles ou non autorisées.</p>'}</article>`}).join('')}init();</script></body></html>
