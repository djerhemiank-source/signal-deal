<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d73"><meta name="description" content="Issoire Connect — commerces, bons plans, invendus, emploi et événements locaux."><link rel="manifest" href="manifest.webmanifest"><title>Issoire Connect</title><style>
:root{--b:#123d73;--b2:#256cab;--o:#f47721;--bg:#f5f7fb;--c:#fff;--ink:#172033;--m:#697386;--l:#e1e6ee;--g:#188650}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:75px}button,input{font:inherit}.top{position:sticky;top:0;z-index:20;height:64px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:8px 13px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;color:var(--b)}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff}.btn{border:1px solid var(--l);background:#fff;border-radius:11px;padding:10px 12px;font-weight:800;color:var(--ink);cursor:pointer}.primary{background:var(--o);border-color:var(--o);color:white}.blue{background:var(--b);border-color:var(--b);color:#fff}.wrap{max-width:1060px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,var(--b),var(--b2));border-radius:22px;padding:22px;color:#fff}.hero h1{font-size:clamp(30px,7vw,48px);margin:0}.hero p{opacity:.9}.search{display:flex;gap:7px;background:#fff;border-radius:14px;padding:6px}.search input{min-width:0;flex:1;border:0;outline:0;padding:10px}.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.tile{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer}.tile span{font-size:27px;display:block}.tile b{font-size:12px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sectionHead h2{margin:0}.muted{color:var(--m);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px}.card h3{margin:4px 0}.pill{display:inline-block;font-size:10px;font-weight:850;background:#eef3f8;color:var(--b);border-radius:99px;padding:5px 7px}.price{font-size:20px;color:var(--b);font-weight:950}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex;z-index:25}.bottom button{width:25%;border:0;background:#fff;padding:9px 2px;color:#5e6878}.bottom button b{display:block;font-size:10px}.status{border:1px solid var(--l);border-radius:12px;padding:10px 12px;margin-top:12px;background:#fff;color:var(--m);font-size:12px}.empty{text-align:center;border:1px dashed var(--l);border-radius:14px;padding:23px;color:var(--m)}.fav{color:#a51f35}.install{display:none}@media(max-width:780px){.cards{grid-template-columns:1fr}.menu{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class="top"><div class="brand"><span class="mark">IC</span><span>ISSOIRE CONNECT</span></div><div><button id="installBtn" class="btn blue install">⬇️ Installer</button></div></header>
<main class="wrap"><section class="hero"><h1>Bonjour Issoire 👋</h1><p>Commerces, bons plans, invendus, emploi et événements autour de vous.</p><div class="search"><input id="q" placeholder="Que cherchez-vous ?"><button class="btn primary" id="searchBtn">Chercher</button></div></section><div id="status" class="status">Application prête. Aucune donnée n’est chargée tant que vous ne choisissez pas une rubrique.</div><div class="menu"><button class="tile" data-view="businesses"><span>🛍️</span><b>Commerces</b></button><button class="tile" data-view="offers"><span>🔥</span><b>Bons plans</b></button><button class="tile" data-view="invendus"><span>🥖</span><b>Invendus</b></button><button class="tile" data-view="jobs"><span>💼</span><b>Emploi</b></button><button class="tile" data-view="events"><span>📅</span><b>Événements</b></button><button class="tile" data-view="favorites"><span>❤️</span><b>Favoris</b></button><a class="tile" href="../"><span>ℹ️</span><b>À propos</b></a><button class="tile" id="installTile"><span>📲</span><b>Installer</b></button></div><div class="sectionHead"><div><h2 id="title">Bienvenue</h2><div id="subtitle" class="muted">Choisissez une rubrique pour commencer.</div></div></div><div id="out"><div class="empty">Aucun chargement automatique.</div></div></main>
<nav class="bottom"><button data-view="home">🏠<b>Accueil</b></button><button data-view="businesses">🛍️<b>Commerces</b></button><button data-view="offers">🔥<b>Bons plans</b></button><button data-view="favorites">❤️<b>Favoris</b></button></nav>
<script>
'use strict';
const API='https://eazukvtjxeirbitukueb.supabase.co/rest/v1/';
const KEY='sb_publishable_OIOSgs39cGT6s34eVuexIA_5bZGmZVj';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
let promptInstall=null,lastRows=[]; const cache=new Map();
const favs=()=>new Set(JSON.parse(localStorage.getItem('ic_favs')||'[]')); const saveFavs=s=>localStorage.setItem('ic_favs',JSON.stringify([...s]));
async function get(path){if(cache.has(path))return cache.get(path);$('status').textContent='Chargement en cours…';const r=await fetch(API+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('Impossible de charger les données ('+r.status+').');const d=await r.json();cache.set(path,d);$('status').textContent=d.length+' résultat(s) chargé(s).';return d}
const euro=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
function favButton(id){return `<button class="btn" data-fav="${esc(id)}">${favs().has(id)?'♥ Suivi':'♡ Suivre'}</button>`}
function businessCard(x){return `<article class="card"><span class="pill">${esc(x.category||'Commerce')}</span><h3>${esc(x.name)}</h3><div class="muted">📍 ${esc(x.city||'Issoire')}</div><p>${esc(x.description||'')}</p>${favButton(x.id)}</article>`}
function offerCard(x){return `<article class="card"><span class="pill">${esc((x.offer_type||'offre').replace('_',' '))}</span><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p><div class="price">${euro(x.sale_price)}</div>${x.quantity!=null?`<div class="muted">${esc(x.quantity)} restant(s)</div>`:''}</article>`}
function jobCard(x){return `<article class="card"><span class="pill">${esc(x.contract_type||'Emploi')}</span><h3>${esc(x.title)}</h3><div class="muted">📍 ${esc(x.location||'Issoire')}</div><p>${esc(x.description||'')}</p></article>`}
function eventCard(x){return `<article class="card"><span class="pill">Événement</span><h3>${esc(x.title)}</h3><div class="muted">📅 ${x.starts_at?new Date(x.starts_at).toLocaleString('fr-FR'):''}<br>📍 ${esc(x.place||'Issoire')}</div><p>${esc(x.description||'')}</p></article>`}
function render(rows,fn,title,sub){lastRows=rows;$('title').textContent=title;$('subtitle').textContent=sub;$('out').innerHTML=rows.length?`<div class="cards">${rows.map(fn).join('')}</div>`:'<div class="empty">Aucun résultat actif pour le moment.</div>';bindFavs()}
async function view(v){try{if(v==='home'){lastRows=[];$('title').textContent='Bienvenue';$('subtitle').textContent='Choisissez une rubrique.';$('out').innerHTML='<div class="empty">Aucun chargement automatique.</div>';return}if(v==='businesses'){const d=await get('ic_businesses?select=id,name,category,description,city&is_active=eq.true&order=created_at.desc');return render(d,businessCard,'Commerces & services','Les établissements actuellement référencés.')}if(v==='offers'||v==='invendus'){let d=await get('ic_offers?select=id,offer_type,title,description,sale_price,quantity&is_active=eq.true&order=created_at.desc');if(v==='invendus')d=d.filter(x=>['invendu','derniere_minute','destockage'].includes(x.offer_type));return render(d,offerCard,v==='invendus'?'Invendus & dernière minute':'Bons plans',v==='invendus'?'Achetez malin et limitez le gaspillage.':'Promotions et offres locales.')}if(v==='jobs'){const d=await get('ic_jobs?select=id,title,contract_type,description,location&is_active=eq.true&order=created_at.desc');return render(d,jobCard,'Emploi local','Les offres d’emploi publiées localement.')}if(v==='events'){const d=await get('ic_events?select=id,title,description,starts_at,place&is_active=eq.true&order=starts_at.asc');return render(d,eventCard,'Événements','La vie locale à venir.')}if(v==='favorites'){const ids=favs();if(!ids.size)return render([],businessCard,'Mes favoris','Aucun commerce suivi sur cet appareil.');const d=await get('ic_businesses?select=id,name,category,description,city&is_active=eq.true&order=created_at.desc');return render(d.filter(x=>ids.has(x.id)),businessCard,'Mes favoris','Vos commerces suivis sur cet appareil.')}}catch(e){$('status').textContent='Erreur : '+e.message;$('out').innerHTML='<div class="empty">Réessayez dans quelques instants.</div>'}}
function bindFavs(){document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const s=favs(),id=b.dataset.fav;s.has(id)?s.delete(id):s.add(id);saveFavs(s);b.textContent=s.has(id)?'♥ Suivi':'♡ Suivre';b.classList.toggle('fav',s.has(id))})}
async function doSearch(){const q=$('q').value.trim().toLowerCase();if(!q)return;$('status').textContent='Recherche…';try{const d=await get('ic_businesses?select=id,name,category,description,city&is_active=eq.true&order=created_at.desc');const r=d.filter(x=>JSON.stringify(x).toLowerCase().includes(q));render(r,businessCard,'Résultats de recherche',r.length+' commerce(s) correspondant à « '+q+' ».')}catch(e){$('status').textContent='Erreur : '+e.message}}
async function install(){if(promptInstall){promptInstall.prompt();await promptInstall.userChoice;promptInstall=null;$('installBtn').style.display='none'}else alert('Android/Chrome : menu ⋮ puis « Installer l’application ». iPhone/Safari : Partager puis « Sur l’écran d’accueil ». PC Chrome/Edge : utilisez l’icône Installer dans la barre d’adresse.')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e;$('installBtn').style.display='inline-block'});window.addEventListener('appinstalled',()=>{$('status').textContent='Issoire Connect est installé sur cet appareil.'});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));$('searchBtn').onclick=doSearch;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});$('installBtn').onclick=install;$('installTile').onclick=install;
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.IC_DIAG={startupFetches:0};
</script></body></html>
