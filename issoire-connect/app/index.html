<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d73"><link rel="manifest" href="manifest.webmanifest"><title>Issoire Connect</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;margin:20px;background:#fff;border:1px solid #e1e6ee;border-radius:20px;padding:28px;text-align:center;box-shadow:0 12px 35px rgba(18,61,115,.1)}.mark{width:60px;height:60px;border-radius:18px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,#123d73,#256cab);color:#fff;font-weight:900}.muted{color:#697386}</style></head><body><div class="box"><div class="mark">IC</div><h1>Issoire Connect</h1><p id="msg" class="muted">Chargement de l’application V3…</p></div><script>
async function ungzip64(t){const clean=t.replace(/\s+/g,'');const b=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([b]).stream().pipeThrough(ds);return await new Response(stream).text()}
(async()=>{try{if(!('DecompressionStream'in window))throw new Error('Navigateur trop ancien pour charger cette version.');const names=['v3-data-0.txt','v3-data-1.txt','v3-data-2.txt','v3-data-3.txt'];let packed='';for(const n of names){const r=await fetch(n+'?v=9',{cache:'no-store'});if(!r.ok)throw new Error('Fichier '+n+' indisponible');packed+=await r.text()}let html=await ungzip64(packed);if(!html.includes('<!doctype html>')&&!html.includes('<html'))throw new Error('Données V3 invalides');html=html.replace('</body>','<script src="claim-patch.js?v=9"><\/script><script src="pro-edit-patch.js?v=9"><\/script><script src="search-patch.js?v=9"><\/script></body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
