<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d73">
<title>Issoire Connect — chargement V3</title>
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f8fb;color:#172033;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}.mark{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,#123d73,#286fa9);color:#fff;display:grid;place-items:center;margin:0 auto 15px;font-weight:950;font-size:25px}.spin{width:32px;height:32px;border:4px solid #dfe7f0;border-top-color:#123d73;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head><body><div class="box"><div class="mark">IC</div><h2>Issoire Connect</h2><p>Chargement de l’application complète…</p><div class="spin"></div><div id="err"></div></div>
<script>
(async()=>{
 try{
  if(typeof DecompressionStream==='undefined')throw new Error('Votre navigateur doit être mis à jour pour ouvrir cette version.');
  const files=['v3-data-0.txt','v3-data-1.txt','v3-data-2.txt','v3-data-3.txt'];
  const parts=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=3',{cache:'no-store'});if(!r.ok)throw new Error('Fichier application manquant : '+f);return (await r.text()).trim()}));
  const b64=parts.join('');
  const raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const page=await new Response(stream).text();
  document.open();document.write(page);document.close();
 }catch(e){document.getElementById('err').innerHTML='<p style="color:#a51f35"><b>Impossible de charger l’application.</b><br>'+String(e.message||e)+'</p><button onclick="location.reload()" style="padding:11px 16px;border:0;border-radius:10px;background:#123d73;color:#fff;font-weight:800">Réessayer</button>'}
})();
</script></body></html>
