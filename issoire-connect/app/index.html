<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d73"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="manifest" href="manifest.webmanifest?v=57.0"><title>Issoire Connect V.57</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;margin:20px;background:#fff;border:1px solid #e1e6ee;border-radius:20px;padding:28px;text-align:center;box-shadow:0 12px 35px rgba(18,61,115,.1)}.mark{width:60px;height:60px;border-radius:18px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,#123d73,#256cab);color:#fff;font-weight:900}.muted{color:#697386}.version{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#fff2e8;color:#b94c00;font-weight:800;font-size:12px}</style></head><body><div class="box"><div class="mark">IC</div><h1>Issoire Connect</h1><p id="msg" class="muted">Mise à jour vers la V.57…</p><span class="version">V.57 • version en ligne</span></div><script>
window.__IC_DEPLOY__='V57-2026-09-05';
async function ungzip64(t){const clean=t.replace(/\s+/g,'');const b=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([b]).stream().pipeThrough(ds);return await new Response(stream).text()}
(async()=>{try{
if(typeof window.DecompressionStream!=='function')throw new Error('Ce navigateur doit être mis à jour pour charger Issoire Connect V.57.');
const names=Array.from({length:10},(_,i)=>`v57-${String(i).padStart(2,'0')}.txt`);let packed='';
for(const n of names){const r=await fetch(n+'?v=57.0-20260905',{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw new Error('Mise à jour incomplète : '+n);packed+=await r.text()}
let html=await ungzip64(packed);if(!html.includes('APP_VERSION="V.57"')&&!html.includes("APP_VERSION='V.57'"))throw new Error('La V.57 n’a pas été reconnue.');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('msg').textContent='Erreur de chargement : '+e.message;console.error(e)}})();
</script></body></html>
