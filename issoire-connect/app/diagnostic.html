<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d73"><link rel="manifest" href="manifest.webmanifest?v=65.0"><title>Diagnostic Issoire Connect V.65</title><style>:root{--navy:#123d73;--bg:#f5f7fb;--ink:#172033;--muted:#697386;--line:#e1e6ee;--ok:#13795b;--warn:#9a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:16px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 24px rgba(18,61,115,.08)}h1{margin-bottom:4px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f5}.row:last-child{border-bottom:0}.ok{color:var(--ok);font-weight:800}.warn{color:var(--warn);font-weight:800}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:13px 16px;background:var(--navy);color:#fff;text-decoration:none;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}.secondary{background:#eef3f8;color:var(--navy)}pre{white-space:pre-wrap;word-break:break-word;background:#f6f8fb;padding:12px;border-radius:12px}</style></head><body><div class="wrap"><h1>🧪 Diagnostic Issoire Connect</h1><p class="muted">V.65 — Installation, mobile et pré-lancement 1.0</p><div class="card"><h2>Contrôles automatiques</h2><div id="rows">Chargement…</div></div><div class="card"><h2>Tests nécessitant votre téléphone</h2><button id="geo" class="btn">📍 Tester la géolocalisation</button><button id="notif" class="btn">🔔 Tester la permission notifications</button><button id="sw" class="btn secondary">⚙️ Actualiser le Service Worker</button><a class="btn secondary" href="installer.html?v=65.0">📲 Tester l’installation</a><a class="btn secondary" href="./?v=65.0">Ouvrir l’application</a><div id="manual" class="muted"></div></div><div class="card"><h2>Informations techniques</h2><pre id="tech"></pre></div></div><script>
const rows=document.getElementById('rows'),manual=document.getElementById('manual'),tech=document.getElementById('tech');
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function inApp(){const u=navigator.userAgent||'';return /FBAN|FBAV|FB_IAB|Messenger|Instagram|; wv\)|\bwv\b/i.test(u)}
function r(label,val,detail=''){return `<div class="row"><span>${label}${detail?`<br><small class="muted">${detail}</small>`:''}</span><b class="${val?'ok':'warn'}">${val?'✅ OK':'⚠️'}</b></div>`}
async function run(){let manifest=null,manifestOk=false,swReg=null;try{const mr=await fetch('manifest.webmanifest?v=65.0',{cache:'no-store'});manifest=await mr.json();manifestOk=mr.ok&&manifest.start_url?.includes('65.0')&&Array.isArray(manifest.icons)&&manifest.icons.some(x=>x.sizes==='192x192')&&manifest.icons.some(x=>x.sizes==='512x512')}catch{}try{if('serviceWorker'in navigator){swReg=await navigator.serviceWorker.register('sw.js?v=65.0-20260906',{scope:'./',updateViaCache:'none'});await swReg.update()}}catch{}const checks=[['Contexte sécurisé HTTPS',window.isSecureContext],['Navigateur en ligne',navigator.onLine],['Service Worker supporté','serviceWorker'in navigator],['Service Worker enregistré',!!swReg],['Manifeste V.65 valide',manifestOk],['Icônes 192 + 512',!!manifest?.icons?.some(x=>x.sizes==='192x192')&&!!manifest?.icons?.some(x=>x.sizes==='512x512')],['Mode application installée',standalone()],['Géolocalisation disponible','geolocation'in navigator],['Notifications disponibles','Notification'in window],['PushManager disponible','PushManager'in window],['DecompressionStream disponible',typeof DecompressionStream==='function'],['Navigateur intégré Messenger/Facebook/Instagram',!inApp(),'Pour installer, mieux vaut Chrome/Safari']];rows.innerHTML=checks.map(x=>r(...x)).join('');tech.textContent=JSON.stringify({version:'V.65',userAgent:navigator.userAgent,platform:navigator.platform,language:navigator.language,online:navigator.onLine,secureContext:window.isSecureContext,standalone:standalone(),notificationPermission:'Notification'in window?Notification.permission:'non supporté',inAppBrowser:inApp(),serviceWorkerController:!!navigator.serviceWorker?.controller,manifest},null,2)}
document.getElementById('geo').onclick=()=>{if(!navigator.geolocation)return manual.innerHTML='<p class="warn">Géolocalisation non supportée.</p>';navigator.geolocation.getCurrentPosition(p=>manual.innerHTML=`<p class="ok">✅ Géolocalisation autorisée. Précision approximative : ${Math.round(p.coords.accuracy)} m. Aucune position n’est enregistrée par cette page.</p>`,e=>manual.innerHTML=`<p class="warn">Géolocalisation non validée : ${e.message}</p>`,{enableHighAccuracy:false,timeout:10000,maximumAge:0})};
document.getElementById('notif').onclick=async()=>{if(!('Notification'in window))return manual.innerHTML='<p class="warn">Notifications non supportées.</p>';try{const p=await Notification.requestPermission();manual.innerHTML=`<p class="${p==='granted'?'ok':'warn'}">Permission notifications : ${p}</p>`}catch(e){manual.innerHTML=`<p class="warn">${e.message}</p>`}};
document.getElementById('sw').onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistration('./');if(r){await r.update();if(r.waiting)r.waiting.postMessage('SKIP_WAITING');manual.innerHTML='<p class="ok">✅ Service Worker actualisé.</p>'}else manual.innerHTML='<p class="warn">Aucun Service Worker enregistré.</p>'}catch(e){manual.innerHTML=`<p class="warn">${e.message}</p>`}};
run();
</script></body></html>
