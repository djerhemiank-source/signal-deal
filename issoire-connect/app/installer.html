<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d73"><link rel="manifest" href="manifest.webmanifest?v=63.0"><title>Installer Issoire Connect</title><meta name="description" content="Installez Issoire Connect sur votre téléphone."><style>body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center}.card{width:min(560px,calc(100% - 32px));box-sizing:border-box;background:#fff;border:1px solid #e1e6ee;border-radius:24px;padding:30px;box-shadow:0 16px 42px rgba(18,61,115,.12);text-align:center}.logo{width:76px;height:76px;margin:auto;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#123d73,#256cab);color:#fff;font-size:25px;font-weight:900}.btn{width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:15px 18px;margin-top:14px;font:inherit;font-weight:850;cursor:pointer}.primary{background:#123d73;color:#fff}.secondary{background:#eef3f8;color:#123d73}.muted{color:#697386;line-height:1.5}.help{margin-top:18px;padding:15px;border-radius:14px;background:#f6f8fb;text-align:left;line-height:1.55}.ok{color:#13795b;font-weight:800}.hide{display:none}</style></head><body><main class="card"><div class="logo">IC</div><h1>Installer Issoire Connect</h1><p class="muted">L’application locale d’Issoire directement sur votre écran d’accueil.</p><button id="installBtn" class="btn primary">📲 Installer Issoire Connect</button><button id="openBtn" class="btn secondary">Ouvrir l’application</button><div id="status" class="help"><b>Installation :</b><br>Appuyez sur le bouton ci-dessus. Si votre téléphone ne propose pas l’installation automatiquement, les instructions adaptées s’afficheront ici.</div></main><script>const APP='./?v=63.0';let deferredPrompt=null;const btn=document.getElementById('installBtn'),status=document.getElementById('status');function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}async function init(){if('serviceWorker'in navigator){try{const r=await navigator.serviceWorker.register('sw.js?v=63.0-20260905',{scope:'./',updateViaCache:'none'});await r.update()}catch(e){console.warn(e)}}if(standalone()){btn.textContent='✅ Issoire Connect est déjà installé';btn.disabled=true;status.innerHTML='<span class="ok">L’application est déjà installée sur cet appareil.</span>';return}if(isiOS()){status.innerHTML='<b>Sur iPhone / iPad :</b><br>1. Ouvrez cette page dans <b>Safari</b>.<br>2. Touchez le bouton <b>Partager</b> ⬆️.<br>3. Choisissez <b>Sur l’écran d’accueil</b>.<br>4. Touchez <b>Ajouter</b>.'}}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.disabled=false;status.innerHTML='<span class="ok">Votre téléphone est prêt : appuyez sur “Installer Issoire Connect”.</span>'});window.addEventListener('appinstalled',()=>{deferredPrompt=null;btn.textContent='✅ Installation terminée';btn.disabled=true;status.innerHTML='<span class="ok">Issoire Connect est installé sur votre écran d’accueil.</span>'});btn.addEventListener('click',async()=>{if(standalone())return;if(deferredPrompt){deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;deferredPrompt=null;if(choice.outcome==='accepted'){status.innerHTML='<span class="ok">Installation acceptée. L’icône va apparaître sur votre téléphone.</span>'}else{status.innerHTML='Installation annulée. Vous pouvez réessayer quand vous voulez.'}return}if(isiOS()){status.scrollIntoView({behavior:'smooth',block:'center'});return}status.innerHTML='<b>Sur Android :</b><br>Si la fenêtre d’installation ne s’affiche pas, ouvrez le menu du navigateur <b>⋮</b> puis choisissez <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.<br><br>Vous pouvez aussi ouvrir Issoire Connect puis utiliser ce même menu.'});document.getElementById('openBtn').addEventListener('click',()=>location.href=APP);init();</script></body></html>
