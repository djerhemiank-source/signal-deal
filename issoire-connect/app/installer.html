<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d73"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Issoire Connect"><link rel="manifest" href="manifest.webmanifest?v=65.0"><link rel="icon" href="icon-192.svg"><title>Installer Issoire Connect</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.card{width:min(580px,100%);background:#fff;border:1px solid #e1e6ee;border-radius:24px;padding:28px;box-shadow:0 16px 42px rgba(18,61,115,.12);text-align:center}.logo{width:78px;height:78px;margin:auto;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#123d73,#256cab);color:#fff;font-size:25px;font-weight:900}.muted{color:#697386;line-height:1.5}.badge{display:inline-flex;margin-top:10px;padding:6px 10px;border-radius:999px;background:#eef3f8;color:#123d73;font-size:12px;font-weight:800}.btn{width:100%;border:0;border-radius:14px;padding:15px 18px;margin-top:12px;font:inherit;font-weight:850;cursor:pointer}.primary{background:#123d73;color:#fff}.secondary{background:#eef3f8;color:#123d73}.ghost{background:#fff;color:#123d73;border:1px solid #e1e6ee}.help{margin-top:18px;padding:16px;border-radius:14px;background:#f6f8fb;text-align:left;line-height:1.55}.ok{color:#13795b;font-weight:800}.warn{color:#9a5b00;font-weight:800}.small{font-size:12px;color:#697386;margin-top:12px}</style></head><body><main class="card"><div class="logo">IC</div><h1>Installer Issoire Connect</h1><p class="muted">L’application locale d’Issoire directement sur votre écran d’accueil.</p><span id="badge" class="badge">Détection du navigateur…</span><button id="install" class="btn primary">📲 Préparer l’installation</button><button id="open" class="btn secondary">Ouvrir Issoire Connect</button><button id="copy" class="btn ghost">🔗 Copier le lien d’installation</button><div id="status" class="help">Vérification de votre appareil…</div><div class="small">V.65 • Tests & validation pré-lancement</div></main><script>
const SHARE='https://djerhemiank-source.github.io/signal-deal/issoire-connect/installer/';const APP='./?v=65.0';let promptEvent=null;const ua=navigator.userAgent||'',btn=document.getElementById('install'),status=document.getElementById('status'),badge=document.getElementById('badge');
const ios=()=>/iphone|ipad|ipod/i.test(ua),android=()=>/android/i.test(ua),inApp=()=>/FBAN|FBAV|FB_IAB|Messenger|Instagram|; wv\)|\bwv\b/i.test(ua),standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function chromeIntent(){const p='djerhemiank-source.github.io/signal-deal/issoire-connect/app/installer.html?v=65.0';return `intent://${p}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(SHARE)};end`}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;btn.textContent='📲 Installer maintenant';status.innerHTML='<span class="ok">✅ Installation prête. Appuyez sur « Installer maintenant ».</span>'});window.addEventListener('appinstalled',()=>{promptEvent=null;btn.textContent='✅ Issoire Connect est installé';btn.disabled=true;status.innerHTML='<span class="ok">Installation terminée.</span>'});
async function init(){if('serviceWorker'in navigator){try{const r=await navigator.serviceWorker.register('sw.js?v=65.0-20260906',{scope:'./',updateViaCache:'none'});await r.update();if(r.waiting)r.waiting.postMessage('SKIP_WAITING')}catch{}}if(standalone()){badge.textContent='Application installée';btn.textContent='✅ Déjà installé';btn.disabled=true;status.innerHTML='<span class="ok">Issoire Connect est déjà installé sur cet appareil.</span>';return}if(inApp()){badge.textContent='Navigateur intégré Messenger/Facebook';btn.textContent=android()?'🌐 Ouvrir dans Chrome pour installer':'🌐 Ouvrir dans Safari puis installer';status.innerHTML='<span class="warn">Le navigateur intégré ne propose généralement pas l’installation PWA.</span><br>Ouvrez cette page dans Chrome ou Safari.';return}if(ios()){badge.textContent='iPhone / iPad';btn.textContent='📲 Instructions iPhone / iPad';status.innerHTML='<b>Safari :</b> Partager ⬆️ → <b>Sur l’écran d’accueil</b> → <b>Ajouter</b>.';return}if(android()){badge.textContent='Android';status.innerHTML='Chrome vérifie si l’installation directe est disponible. Sinon : menu <b>⋮ → Installer l’application</b>.';return}badge.textContent='Ordinateur';status.innerHTML='Sur Chrome ou Edge, utilisez l’icône d’installation dans la barre d’adresse ou le menu du navigateur.'}
btn.onclick=async()=>{if(standalone())return;if(inApp()){if(android()){location.href=chromeIntent()}else status.innerHTML='<b>iPhone :</b> menu ⋯ de Messenger/Facebook → <b>Ouvrir dans le navigateur</b>, puis Safari → Partager ⬆️ → Sur l’écran d’accueil.';return}if(promptEvent){try{await promptEvent.prompt();const c=await promptEvent.userChoice;promptEvent=null;status.innerHTML=c.outcome==='accepted'?'<span class="ok">✅ Installation acceptée.</span>':'Installation annulée.'}catch{status.innerHTML='Menu du navigateur → <b>Installer l’application</b>.'}return}if(ios()){status.innerHTML='<b>Safari :</b> Partager ⬆️ → Sur l’écran d’accueil → Ajouter.';return}if(android()){status.innerHTML='<b>Android :</b> menu ⋮ → Installer l’application / Ajouter à l’écran d’accueil.';return}status.innerHTML='Chrome/Edge : menu → Installer ce site comme application.'};document.getElementById('open').onclick=()=>location.href=APP;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(SHARE);status.innerHTML='<span class="ok">✅ Lien copié.</span>'}catch{status.textContent=SHARE}};init();
</script></body></html>
