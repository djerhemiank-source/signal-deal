<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d73"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Issoire Connect"><link rel="manifest" href="manifest.webmanifest?v=63.1"><link rel="icon" href="icon-192.svg"><title>Installer Issoire Connect</title><meta name="description" content="Installez Issoire Connect sur votre téléphone."><style>body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center}.card{width:min(560px,calc(100% - 32px));box-sizing:border-box;background:#fff;border:1px solid #e1e6ee;border-radius:24px;padding:30px;box-shadow:0 16px 42px rgba(18,61,115,.12);text-align:center}.logo{width:76px;height:76px;margin:auto;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#123d73,#256cab);color:#fff;font-size:25px;font-weight:900}.btn{width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:15px 18px;margin-top:14px;font:inherit;font-weight:850;cursor:pointer}.primary{background:#123d73;color:#fff}.secondary{background:#eef3f8;color:#123d73}.muted{color:#697386;line-height:1.5}.help{margin-top:18px;padding:15px;border-radius:14px;background:#f6f8fb;text-align:left;line-height:1.55}.ok{color:#13795b;font-weight:800}.warn{color:#9a5b00;font-weight:800}.ready{box-shadow:0 0 0 4px rgba(18,61,115,.14)}.modal{position:fixed;inset:0;background:rgba(8,18,32,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:22px;padding:24px;box-sizing:border-box;text-align:left}.sheet h2{margin-top:0}.sheet .btn{margin-top:18px}</style></head><body><main class="card"><div class="logo">IC</div><h1>Installer Issoire Connect</h1><p class="muted">L’application locale d’Issoire directement sur votre écran d’accueil.</p><button id="installBtn" class="btn primary">📲 Installer Issoire Connect</button><button id="openBtn" class="btn secondary">Ouvrir l’application</button><div id="status" class="help"><b>Installation :</b><br>Votre téléphone vérifie si l’installation directe est disponible.</div></main><div id="modal" class="modal" role="dialog" aria-modal="true"><div class="sheet"><h2 id="modalTitle">Installation</h2><div id="modalBody"></div><button id="closeModal" class="btn secondary">Fermer</button></div></div><script>const APP='./?v=63.0';let deferredPrompt=null;let ready=false;const btn=document.getElementById('installBtn'),status=document.getElementById('status'),modal=document.getElementById('modal'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody');function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}function isAndroid(){return /android/i.test(navigator.userAgent)}function isChromium(){return /chrome|crios|edg|samsungbrowser/i.test(navigator.userAgent)&&!/firefox|fxios/i.test(navigator.userAgent)}function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function showModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modal.classList.add('open')}function hideModal(){modal.classList.remove('open')}document.getElementById('closeModal').onclick=hideModal;modal.addEventListener('click',e=>{if(e.target===modal)hideModal()});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;ready=true;btn.textContent='📲 Installer maintenant';btn.classList.add('ready');status.innerHTML='<span class="ok">✅ Installation prête. Appuyez sur « Installer maintenant ».</span>'});window.addEventListener('appinstalled',()=>{deferredPrompt=null;ready=false;btn.textContent='✅ Issoire Connect est installé';btn.disabled=true;status.innerHTML='<span class="ok">Installation terminée. L’icône Issoire Connect est sur votre écran d’accueil.</span>'});async function init(){if('serviceWorker'in navigator){try{const r=await navigator.serviceWorker.register('sw.js?v=63.1-20260906',{scope:'./',updateViaCache:'none'});await r.update()}catch(e){console.warn('service worker',e)}}if(standalone()){btn.textContent='✅ Issoire Connect est déjà installé';btn.disabled=true;status.innerHTML='<span class="ok">L’application est déjà installée sur cet appareil.</span>';return}if(isiOS()){btn.textContent='📲 Installer sur iPhone / iPad';status.innerHTML='<b>iPhone / iPad :</b><br>L’installation passe par le menu Partager du navigateur.';return}if(isAndroid()){status.innerHTML='<b>Android :</b><br>Chrome prépare l’installation. Dès qu’elle est autorisée, le bouton affichera <b>« Installer maintenant »</b>.';setTimeout(()=>{if(!ready&&!standalone())status.innerHTML='<span class="warn">Installation directe pas encore proposée par le navigateur.</span><br>Appuyez sur le bouton : je vous indique immédiatement la méthode de secours.'},4000)}}btn.addEventListener('click',async()=>{if(standalone())return;if(deferredPrompt){try{await deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;deferredPrompt=null;ready=false;btn.classList.remove('ready');if(choice.outcome==='accepted'){status.innerHTML='<span class="ok">Installation acceptée. L’icône va apparaître sur votre appareil.</span>';btn.textContent='Installation en cours…'}else{status.innerHTML='Installation annulée. Vous pourrez recommencer quand vous voulez.';btn.textContent='📲 Réessayer d’installer'}}catch(e){showModal('Installation',`Le navigateur n’a pas pu ouvrir la fenêtre d’installation.<br><br><b>Android :</b> ouvrez le menu <b>⋮</b> puis choisissez <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.`)}return}if(isiOS()){showModal('Installer sur iPhone / iPad','1. Ouvrez cette page dans <b>Safari</b> ou votre navigateur iOS.<br>2. Touchez <b>Partager</b> ⬆️.<br>3. Choisissez <b>Sur l’écran d’accueil</b>.<br>4. Touchez <b>Ajouter</b>.');return}if(isAndroid()){showModal('Installer sur Android',`Le navigateur n’a pas encore fourni l’installation automatique.<br><br><b>Méthode immédiate :</b><br>1. Touchez le menu <b>⋮</b> en haut à droite de Chrome.<br>2. Choisissez <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.<br>3. Confirmez <b>Installer</b>.<br><br>Si l’option n’apparaît pas encore, gardez cette page ouverte quelques instants puis retouchez le bouton.`);return}showModal('Installer Issoire Connect','Dans le menu de votre navigateur, choisissez <b>Installer l’application</b>, <b>Apps → Installer ce site comme application</b> ou <b>Ajouter à l’écran d’accueil</b>, selon votre navigateur.')} );document.getElementById('openBtn').addEventListener('click',()=>location.href=APP);init();</script></body></html>
