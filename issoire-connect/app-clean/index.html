<script>
const SUPABASE_URL="https://eazukvtjxeirbitukueb.supabase.co",SUPABASE_KEY="sb_publishable_OIOSgs39cGT6s34eVuexIA_5bZGmZVj";
const PAY={essential:"https://buy.stripe.com/test_00w14ob7wajWgGb5K518c03",pro:"https://buy.stripe.com/test_dRm8wQ2B0cs4cpVb4p18c04",proplus:"https://buy.stripe.com/test_00w7sMb7w3VygGb2xT18c05"};
const HAS_SUPABASE=!!(window.supabase&&window.supabase.createClient);
const sb=HAS_SUPABASE?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const DEMO_OFFLINE=!HAS_SUPABASE;
const SAVED_GEO=(()=>{try{return JSON.parse(localStorage.getItem("ic_resident_geo")||"null")}catch(e){return null}})();
const S={page:"home",history:[],session:null,profile:null,businesses:[],products:[],offers:[],jobs:[],ads:[],classifieds:[],events:[],follows:new Set(),myBusinesses:[],myOrders:[],messages:[],location:SAVED_GEO,installPrompt:null,stats:{users:0,pros:0}};
const $=s=>document.querySelector(s), main=$("#main"), modal=$("#modal"), modalBody=$("#modalBody"), toast=$("#toast");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const euro=n=>Number(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
function say(t){toast.textContent=t;toast.classList.remove("hidden");setTimeout(()=>toast.classList.add("hidden"),2300)}
function openModal(h){modalBody.innerHTML=h;modal.classList.remove("hidden")} function closeModal(){modal.classList.add("hidden")}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
function planLabel(p){return ({free:"Gratuit",essential:"Essentiel 4,99 €",pro:"Pro 9,99 €",proplus:"Pro+ 19,99 €"})[p]||p}
function iconFor(cat){const t=(cat||"").toLowerCase();if(t.includes("aliment"))return"🥖";if(t.includes("auto"))return"🚗";if(t.includes("service"))return"🧰";if(t.includes("rest"))return"🍽️";if(t.includes("sant"))return"🩺";if(t.includes("beau"))return"💇";return"🏪"}
function distance(lat1,lon1,lat2,lon2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function businessDistance(b){if(!S.location||b.latitude==null||b.longitude==null)return null;return distance(S.location.lat,S.location.lon,b.latitude,b.longitude)}
function residentRadius(){return Number(S.profile?.radius_km||localStorage.getItem("ic_resident_radius")||10)}
function residentCity(){return (S.profile?.city||localStorage.getItem("ic_resident_city")||"").trim()}
function residentPostal(){return (S.profile?.postal_code||localStorage.getItem("ic_resident_postal")||"").trim()}
function businessVisibleForResident(b){
 const d=businessDistance(b),r=residentRadius();
 if(d!=null)return d<=r;
 const city=residentCity().toLowerCase(),postal=residentPostal();
 if(postal&&b.postal_code)return String(b.postal_code)===postal;
 if(city&&b.city)return String(b.city).toLowerCase()===city;
 return true;
}
function visibleBusinesses(){return S.businesses.filter(businessVisibleForResident)}
function saveGeoLocal(lat,lon,label){
 S.location={lat:Number(lat),lon:Number(lon),label:label||""};
 localStorage.setItem("ic_resident_geo",JSON.stringify(S.location));
}
async function geocodeManualLocation(city,postal){
 const q=[postal,city].filter(Boolean).join(" ");
 if(!q)throw new Error("Indiquez une ville ou un code postal.");
 const url=`https://data.geopf.fr/geocodage/search?q=${encodeURIComponent(q)}&index=address&limit=1`;
 const r=await fetch(url);
 if(!r.ok)throw new Error("Le service de localisation est indisponible.");
 const j=await r.json(),f=j?.features?.[0],c=f?.geometry?.coordinates;
 if(!c||c.length<2)throw new Error("Ville ou code postal introuvable.");
 return {lat:Number(c[1]),lon:Number(c[0]),label:f?.properties?.label||q};
}
async function reverseGeo(lat,lon){
 try{
  const url=`https://data.geopf.fr/geocodage/reverse?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&index=address&limit=1`;
  const r=await fetch(url);if(!r.ok)return null;
  const j=await r.json();return j?.features?.[0]?.properties||null;
 }catch(e){return null}
}
function locationSummary(){
 const r=residentRadius(),city=residentCity(),postal=residentPostal();
 if(S.location)return `📍 ${esc(S.location.label||city||"Position enregistrée")} · rayon ${r} km`;
 if(city||postal)return `📍 ${esc([postal,city].filter(Boolean).join(" "))} · rayon ${r} km`;
 return `📍 Localisation non renseignée · rayon ${r} km`;
}
function requireAuth(next){if(S.session)return true;if(!sb){say("Mode démonstration : connexion réelle disponible quand l’application est en ligne.");return false}authModal(next);return false}
function updateBackButton(){const b=$("#backBtn");if(b)b.style.display=(S.page!=="home"||S.history.length)?"inline-block":"none"}
function navActive(){document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.page===S.page));updateBackButton()}
function goBack(){
 if(!modal.classList.contains("hidden")){closeModal();return}
 if(S.history.length){S.page=S.history.pop();navActive();render();window.scrollTo({top:0,behavior:"smooth"});return}
 if(S.page!=="home"){S.page="home";navActive();render();window.scrollTo({top:0,behavior:"smooth"});return}
 if(window.history.length>1)window.history.back();
}
async function fetchAllBusinesses(){
 const all=[];
 for(let from=0;;from+=1000){
  const r=await sb.from("ic_businesses").select("*").eq("is_active",true).order("name",{ascending:true}).range(from,from+999);
  if(r.error){console.error(r.error);break}
  const rows=r.data||[];all.push(...rows);if(rows.length<1000)break;
 }
 return all;
}
async function loadPublic(){
 if(!sb){S.businesses=[];S.products=[];S.offers=[];S.jobs=[];S.classifieds=[];S.events=[];S.ads=[];S.stats={users:0,pros:0};return}
 const qs=[
  fetchAllBusinesses(),
  sb.from("ic_products").select("*").eq("is_active",true).order("created_at",{ascending:false}),
  sb.from("ic_offers").select("*").eq("is_active",true).order("created_at",{ascending:false}),
  sb.from("ic_jobs").select("*").eq("is_active",true).order("created_at",{ascending:false}),
  sb.from("ic_classifieds").select("*").eq("is_active",true).order("created_at",{ascending:false}),
  sb.from("ic_events").select("*").eq("is_active",true).gte("starts_at",new Date(Date.now()-86400000).toISOString()).order("starts_at"),
  sb.from("ic_ad_campaigns").select("*").eq("is_active",true).order("created_at",{ascending:false})
 ];
 const rs=await Promise.all(qs);S.businesses=rs[0]||[];[S.products,S.offers,S.jobs,S.classifieds,S.events,S.ads]=rs.slice(1).map(r=>r.data||[]);
 const [u,p]=await Promise.all([
   sb.from("ic_profiles").select("id",{count:"exact",head:true}),
   sb.from("ic_businesses").select("id",{count:"exact",head:true}).eq("is_active",true)
 ]);
 S.stats.users=u.count||0; S.stats.pros=p.count||0;
}
async function loadPrivate(){
 if(!sb||!S.session){S.follows=new Set();S.myBusinesses=[];S.myOrders=[];S.messages=[];return}
 await ensureProfile();
 const uid=S.session.user.id;
 const [f,b,o,m]=await Promise.all([
  sb.from("ic_follows").select("business_id").eq("user_id",uid),
  sb.from("ic_businesses").select("*").eq("owner_id",uid).order("created_at"),
  sb.from("ic_orders").select("*").order("created_at",{ascending:false}).limit(50),
  sb.from("ic_messages").select("*").order("created_at",{ascending:false}).limit(100)
 ]);
 S.follows=new Set((f.data||[]).map(x=>x.business_id));S.myBusinesses=b.data||[];S.myOrders=o.data||[];S.messages=m.data||[];
}
async function ensureProfile(){
 if(!sb||!S.session)return;
 const uid=S.session.user.id;let {data}=await sb.from("ic_profiles").select("*").eq("id",uid).maybeSingle();
 if(!data){const role=S.session.user.user_metadata?.role==="pro"?"pro":"resident";const name=S.session.user.user_metadata?.display_name||S.session.user.email?.split("@")[0]||"Utilisateur";await sb.from("ic_profiles").insert({id:uid,display_name:name,role});({data}=await sb.from("ic_profiles").select("*").eq("id",uid).maybeSingle())}
 S.profile=data||null;
 if(S.profile){
  if(S.profile.city)localStorage.setItem("ic_resident_city",S.profile.city);
  if(S.profile.postal_code)localStorage.setItem("ic_resident_postal",S.profile.postal_code);
  if(S.profile.radius_km)localStorage.setItem("ic_resident_radius",String(S.profile.radius_km));
 }
}
async function refresh(){await Promise.all([loadPublic(),loadPrivate()]);render()}

 if(p!==S.page){S.history.push(S.page);if(S.history.length>30)S.history.shift()}
 S.page=p;navActive();render();window.scrollTo({top:0,behavior:"smooth"})
}

function menu(){const a=[["🛍️","Commerces","businesses"],["🔥","Bons plans","deals"],["🥖","Invendus","deals"],["💼","Emploi","jobs"],["📣","Petites annonces","classifieds"],["📅","Événements","events"],["🤝","Entraide","classifieds"],["📍","Autour de moi","nearby"]];return `<div class="gridmenu">${a.map(x=>`<button class="tile" onclick="go('${x[2]}')"><span>${x[0]}</span><b>${x[1]}</b></button>`).join("")}</div>`}
function businessCard(b){const d=businessDistance(b),follow=S.follows.has(b.id),official=b.source==="sirene_officiel";return `<article class="card"><div class="row"><div class="avatar">${iconFor(b.category)}</div><div><h3>${esc(b.name)}</h3><div class="muted">${esc(b.category)} · ${d!=null?d.toFixed(1)+" km":esc(b.city||"Issoire")}</div></div></div><p>${esc(b.description||"")}</p><span class="pill">${official?(b.is_claimed?"✓ Fiche revendiquée":"🇫🇷 Répertoire SIRENE"):planLabel(b.plan)}</span><div class="actions"><button class="btn brand" onclick="viewBusiness('${b.id}')">Voir</button><button class="btn ${follow?"followed":""}" onclick="toggleFollow('${b.id}')">${follow?"♥ Suivi":"♡ Suivre"}</button></div></article>`}
function offerCard(o){const b=S.businesses.find(x=>x.id===o.business_id),pct=o.original_price?Math.round((1-o.sale_price/o.original_price)*100):null;return `<article class="card"><span class="pill">${esc(o.offer_type.replace("_"," "))}</span><h3>${esc(o.title)}</h3><div class="muted">${b?esc(b.name):"Commerce"}${o.quantity!=null?" · "+o.quantity+" restant(s)":""}</div><p>${o.original_price?`<span class="old">${euro(o.original_price)}</span>`:""}<span class="price">${euro(o.sale_price)}</span>${pct?` <span class="pill">-${pct}%</span>`:""}</p><div class="actions"><button class="btn green" onclick="reserveOffer('${o.id}')">Réserver</button>${b?`<button class="btn" onclick="viewBusiness('${b.id}')">Commerce</button>`:""}</div></article>`}
function homePage(){
 const near=[...visibleBusinesses()].sort((a,b)=>(businessDistance(a)??999)-(businessDistance(b)??999)).slice(0,3);
 const last=S.offers.filter(o=>["invendu","derniere_minute","destockage"].includes(o.offer_type)).slice(0,3);

function openResidentLocation(){
 if(!requireAuth("nearby"))return;
 const city=esc(S.profile?.city||residentCity()||"Issoire"),postal=esc(S.profile?.postal_code||residentPostal()||"63500"),radius=residentRadius();
 openModal(`<h2>📍 Ma localisation</h2><p class="muted">Choisissez votre ville et votre rayon de recherche, ou utilisez directement le GPS du téléphone.</p>
 <div class="form">
  <label>Ville</label><input id="locCity" value="${city}" placeholder="Issoire">
  <label>Code postal</label><input id="locPostal" value="${postal}" placeholder="63500" inputmode="numeric">
  <label>Rayon de recherche</label><select id="locRadius">${[2,5,10,20,30,50].map(k=>`<option value="${k}" ${k===radius?"selected":""}>${k} km</option>`).join("")}</select>
  <button class="btn brand" onclick="saveManualLocation()">💾 Enregistrer cette zone</button>
  <button class="btn green" onclick="locateAndSave()">📡 Utiliser ma position GPS</button>
  <div id="locStatus" class="locationstatus">${locationSummary()}</div>
 </div>`);
}
async function saveManualLocation(){
 if(!S.session||!sb)return say("Connectez-vous pour enregistrer votre localisation.");
 const city=$("#locCity").value.trim(),postal=$("#locPostal").value.trim(),radius=Number($("#locRadius").value||10),st=$("#locStatus");
 st.textContent="Recherche de la localisation…";
 try{
  const geo=await geocodeManualLocation(city,postal);
  saveGeoLocal(geo.lat,geo.lon,geo.label);
  localStorage.setItem("ic_resident_city",city);localStorage.setItem("ic_resident_postal",postal);localStorage.setItem("ic_resident_radius",String(radius));
  const {error}=await sb.from("ic_profiles").update({city,postal_code:postal,radius_km:radius,updated_at:new Date().toISOString()}).eq("id",S.session.user.id);
  if(error)throw error;
  S.profile={...(S.profile||{}),city,postal_code:postal,radius_km:radius};
  st.textContent=`✅ ${geo.label} · rayon ${radius} km`;
  say("Zone habitant enregistrée");
  setTimeout(()=>{closeModal();S.page="nearby";render()},450);
 }catch(e){st.textContent="⚠️ "+(e.message||e)}
}
async function locateAndSave(){
 if(!navigator.geolocation)return say("GPS non disponible sur cet appareil.");
 const radius=Number($("#locRadius")?.value||residentRadius()),st=$("#locStatus");
 if(st)st.textContent="Recherche de votre position GPS…";
 navigator.geolocation.getCurrentPosition(async p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude,info=await reverseGeo(lat,lon);
  const city=info?.city||info?.municipality||$("#locCity")?.value.trim()||residentCity()||"";
  const postal=info?.postcode||$("#locPostal")?.value.trim()||residentPostal()||"";
  const label=info?.label||[postal,city].filter(Boolean).join(" ")||"Position GPS";
  saveGeoLocal(lat,lon,label);
  localStorage.setItem("ic_resident_city",city);localStorage.setItem("ic_resident_postal",postal);localStorage.setItem("ic_resident_radius",String(radius));
  if(S.session&&sb){
   const {error}=await sb.from("ic_profiles").update({city,postal_code:postal,radius_km:radius,updated_at:new Date().toISOString()}).eq("id",S.session.user.id);
   if(error){if(st)st.textContent="⚠️ Position trouvée mais profil non enregistré : "+error.message;return}
   S.profile={...(S.profile||{}),city,postal_code:postal,radius_km:radius};
  }
  if(st)st.textContent=`✅ ${label} · rayon ${radius} km`;
  say("Position GPS enregistrée");
  setTimeout(()=>{closeModal();S.page="nearby";render()},450);
 },()=>{if(st)st.textContent="⚠️ Impossible d’obtenir votre position. Autorisez la localisation dans votre navigateur.";},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

function maxRadiusForPlan(plan){
 return ({free:2,essential:5,pro:20,proplus:50})[plan]||2;
}
function requiredPlanForRadius(km){
 if(km<=2)return "free";
 if(km<=5)return "essential";
 if(km<=20)return "pro";
 return "proplus";
}
function radiusSelectorHtml(b){
 const selected=Number(b.visibility_radius_km||2), max=maxRadiusForPlan(b.plan);
 const radii=[2,5,10,20,30,50];
 return `<div class="radiusbox">
   <div class="row between"><div><h3 style="margin:0">📍 Zone de chalandise</h3><div class="muted">Choisissez jusqu’où vos offres et publicités peuvent être mises en avant.</div></div><span class="pill">${selected} km actifs</span></div>
   <div class="radiuschoices">${radii.map(k=>{
     const locked=k>max;
     return `<button class="btn ${k===selected?"selected":""} ${locked?"locked":""}" onclick="${locked?`offerRadiusUpgrade(${k})`:`setBusinessRadius('${b.id}',${k})`}">${locked?"🔒 ":""}${k} km</button>`
   }).join("")}</div>
   <div class="radiusnote">Votre forfait ${planLabel(b.plan)} autorise actuellement jusqu’à <b>${max} km</b>.</div>
  </div>`;
}
async function setBusinessRadius(id,km){
 if(!sb)return say("Mode démo : modification réelle disponible lorsque l’application est en ligne.");
 const b=S.myBusinesses.find(x=>x.id===id); if(!b)return;
 const max=maxRadiusForPlan(b.plan);
 if(km>max)return offerRadiusUpgrade(km);
 const {error}=await sb.from("ic_businesses").update({visibility_radius_km:km,updated_at:new Date().toISOString()}).eq("id",id);
 if(error)return say(error.message);
 say(`Zone de chalandise réglée sur ${km} km`);
 await loadPrivate(); render();
}
function offerRadiusUpgrade(km){
 const plan=requiredPlanForRadius(km);
 const names={essential:"Essentiel — 4,99 €",pro:"Pro — 9,99 €",proplus:"Pro+ — 19,99 €"};
 const maxs={essential:5,pro:20,proplus:50};
 openModal(`<h2>📍 Étendre votre zone à ${km} km</h2>
 <p>Ce rayon dépasse votre zone actuelle. Pour toucher davantage d’habitants et d’entreprises, passez au forfait <b>${names[plan]}</b>.</p>
 <div class="demoresult"><b>${names[plan]}</b><br>Zone de visibilité jusqu’à <b>${maxs[plan]} km</b>.</div>
 <div class="actions"><button class="btn brand" onclick="closeModal();go('account')">Voir mon abonnement</button><button class="btn" onclick="closeModal()">Plus tard</button></div>`);
}

}

function openNotifications(){if(!S.session)return authModal();const followed=S.businesses.filter(b=>S.follows.has(b.id));openModal(`<h2>Mes alertes locales</h2><p>Vous suivez <b>${followed.length}</b> commerce(s).</p><p class="muted">Les nouvelles offres de vos favoris peuvent apparaître en temps réel lorsque l’application est ouverte.</p><button class="btn brand" onclick="askNotifications()">Autoriser les notifications du téléphone</button>`)}
async function askNotifications(){if(!("Notification" in window))return say("Notifications non disponibles");const r=await Notification.requestPermission();say(r==="granted"?"Notifications autorisées":"Notifications non autorisées")}
function setupRealtime(){if(!sb)return;sb.channel("ic-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"ic_offers"},payload=>{const o=payload.new;if(S.follows.has(o.business_id)){say("🔥 Nouveau bon plan d’un commerce suivi");if(Notification.permission==="granted")new Notification("Issoire Connect",{body:o.title||"Nouvelle offre locale"})}loadPublic().then(()=>render())}).subscribe()}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installPrompt=e;$("#installBtn").style.display="inline-block"});window.addEventListener("appinstalled",()=>{say("Issoire Connect est installé");S.installPrompt=null});
async function installApp(){if(S.installPrompt){S.installPrompt.prompt();await S.installPrompt.userChoice;S.installPrompt=null}else openModal(`<h2>Installer Issoire Connect</h2><p><b>Android / Chrome :</b> ouvrez le menu ⋮ puis choisissez « Installer l’application » ou « Ajouter à l’écran d’accueil ».</p><p><b>iPhone / Safari :</b> bouton Partager puis « Sur l’écran d’accueil ».</p>`)}

if(sb){
 sb.auth.onAuthStateChange(async(_,session)=>{S.session=session;if(session)await loadPrivate();else{S.profile=null;await loadPrivate()}render()});
 (async()=>{const {data}=await sb.auth.getSession();S.session=data.session;await Promise.all([loadPublic(),loadPrivate()]);setupRealtime();render()})();
}else{
 S.session=null;
 render();
 setTimeout(()=>say("Mode démonstration autonome prêt"),500);
}
</script>
