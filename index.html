<script>
const SB='https://eazukvtjxeirbitukueb.supabase.co',KEY='sb_publishable_OIOSgs39cGT6s34eVuexIA_5bZGmZVj';const state={page:'home',mode:'h',radius:10,location:null,businesses:[],offers:[],products:[],jobs:[],events:[],needs:[],session:null,profile:null,sub:null,myBiz:[],leads:[],pipeline:[]};const demoB=[{id:'d1',name:'Elancia Issoire',category:'Sport & bien-être',description:'Salle de sport et accompagnement personnalisé.',city:'Issoire',latitude:45.545,longitude:3.249},{id:'d2',name:"Le Bistrot d'Issoire",category:'Restaurant',description:'Cuisine locale et menu du jour.',city:'Issoire',latitude:45.544,longitude:3.252},{id:'d3',name:'Garage Auto Plus',category:'Automobile',description:'Entretien, diagnostic et réparation automobile.',city:'Issoire',latitude:45.548,longitude:3.244},{id:'d4',name:'Cuisines Design',category:'Maison',description:'Conception de cuisines et aménagement intérieur.',city:'Issoire',latitude:45.541,longitude:3.257},{id:'d5',name:"Le Salon d'Émilie",category:'Beauté',description:'Coiffure et soins capillaires.',city:'Issoire',latitude:45.546,longitude:3.255}];const demoO=[{id:'o1',business_id:'d1',title:'-10 % sur le premier mois',benefit_kind:'percent',benefit_value:10,category:'Sport'},{id:'o2',business_id:'d2',title:'Café offert avec le menu',benefit_kind:'gift',category:'Restaurant'},{id:'o3',business_id:'d3',title:'Contrôle visuel offert',benefit_kind:'service',category:'Auto'},{id:'o4',business_id:'d4',title:'Étude 3D offerte',benefit_kind:'service',category:'Maison'},{id:'o5',business_id:'d5',title:'-5 € sur la première prestation',benefit_kind:'fixed',benefit_value:5,category:'Beauté'}];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2500)}function api(path,opt={}){let h={...(opt.headers||{}),apikey:KEY,'Content-Type' class="btn blue" onclick="proAction()">Créer</button></article><article class="card"><h3>Campagne professionnels</h3><p>Diffusez votre offre auprès des entreprises.</p><button class="btn blue" onclick="proAction()">Créer</button></article></div>')}function business(){let b=state.myBiz[0];return shell('🏪 Mon établissement','Gérez votre fiche professionnelle.',proGate()+(b?`<div class="card"><h2>${esc(b.name)}</h2><p>${esc(b.description||'')}</p><div class="muted">📍 ${esc(b.address||b.city||'Issoire')}</div></div>`:'<div class="empty">Aucun établissement rattaché. Vous pourrez revendiquer votre fiche existante.</div>'))}function openAuth(){modal('<h2>Connexion à Issoire Connect</h2><div class="form"><label>Email</label><input id="ae" type="email"><label>Mot de passe</label><input id="ap" type="password" placeholder="8 caractères minimum"><button class="btn blue" onclick="login()">Se connecter</button><button class="btn" onclick="signup()">Créer un compte habitant gratuit</button><div class="muted">Vous pourrez ouvrir ensuite votre espace Pro depuis le même compte.</div></div>')}async function login(){let e=document.getElementById('ae').value.trim(),p=document.getElementById('ap').value;try{let r=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});state.session=r;localStorage.setItem('ic_session',JSON.stringify(r));closeModal();afterLogin();toast('Bienvenue')}catch{toast('Connexion impossible')}}async function signup(){let e=document.getElementById('ae').value.trim(),p=document.getElementById('ap').value;if(!e||p.length<8)return toast('Mot de passe : 8 caractères minimum');try{let r=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p,data:{role:'resident'}})});if(r.access_token){state.session=r;localStorage.setItem('ic_session',JSON.stringify(r));afterLogin()}closeModal();toast('Compte créé')}catch{toast('Création impossible')}}function needLogin(){state.session?toast('Action envoyée'):openAuth()}function openAccount(){if(!state.session)return openAuth();let pro=state.profile?.role==='pro'||state.myBiz.length;modal(`<h2>Mon compte</h2><p><b>${esc(state.profile?.display_name||state.session.user?.email)}</b></p><div class="notice">Votre espace habitant reste toujours disponible.</div><div class="actions"><button class="btn blue" onclick="closeModal();mode('h')">👤 Services locaux</button>${pro?'<button class="btn orange" onclick="closeModal();mode(\'p\')">🏪 Espace Pro</button>':'<button class="btn orange" onclick="becomePro()">🏪 Ouvrir mon espace Pro</button>'}<button class="btn" onclick="logout()">Déconnexion</button></div>`)}async function becomePro(){if(!state.session)return openAuth();try{let uid=state.session.user.id,r=await api('/rest/v1/ic_profiles?id=eq.'+uid,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({role:'pro',updated_at:new Date().toISOString()})});state.profile=r?.[0]||{id:uid,role:'pro'};closeModal();mode('p');toast('Espace Pro ouvert')}catch{toast("Impossible d'ouvrir l'espace Pro")}}function logout(){localStorage.removeItem('ic_session');state.session=null;state.profile=null;state.sub=null;state.myBiz=[];closeModal();mode('h');toast('Déconnecté')}function newNeed(){if(!state.session)return openAuth();modal('<h2>Publier un besoin local</h2><div class="form"><label>Catégorie</label><select id="nc"><option>Maison / travaux</option><option>Automobile</option><option>Services</option><option>Santé / bien-être</option><option>Commerce</option><option>Autre</option></select><label>Décrivez votre besoin</label><textarea id="nt" rows="5" placeholder="Ex. Je cherche un plombier..."></textarea><label>Rayon</label><select id="nr"><option>5</option><option selected>10</option><option>20</option><option>50</option></select><button class="btn orange" onclick="saveNeed()">Publier gratuitement</button></div>')}async function saveNeed(){let t=document.getElementById('nt').value.trim();if(t.length<5)return toast('Décrivez un peu plus votre besoin');try{let r=await api('/rest/v1/ic_needs',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:state.session.user.id,need_text:t,category:document.getElementById('nc').value,city:'Issoire',postal_code:'63500',radius_km:+document.getElementById('nr').value,urgency:'normal'})});state.needs.unshift(r[0]);closeModal();go('needs');toast('Besoin publié gratuitement')}catch{toast('Publication impossible')}}async function afterLogin(){let u=state.session?.user;if(!u)return;try{let [p,s,b,l,pl]=await Promise.all([api('/rest/v1/ic_profiles?id=eq.'+u.id+'&select=*'),api('/rest/v1/ic_subscriptions?user_id=eq.'+u.id+'&select=*'),api('/rest/v1/ic_businesses?owner_id=eq.'+u.id+'&select=*'),api('/rest/v1/sd_prospect_leads?select=*&limit=50'),api('/rest/v1/sd_prospect_pipeline?user_id=eq.'+u.id+'&select=*&limit=100')]);state.profile=p?.[0]||{display_name:u.email?.split('@')[0],role:'resident'};state.sub=s?.[0]||{plan:'free'};state.myBiz=b||[];state.leads=l||[];state.pipeline=pl||[];render()}catch{render()}}async function load(){try{let [b,o,p,j,e,n]=await Promise.all([api('/rest/v1/ic_businesses?select=id,name,category,description,address,city,latitude,longitude,phone,website,logo_url,plan&is_active=eq.true&limit=150'),api('/rest/v1/ic_offers?select=*&is_active=eq.true&limit=100'),api('/rest/v1/ic_products?select=*&is_active=eq.true&limit=100'),api('/rest/v1/ic_jobs?select=*&is_active=eq.true&limit=50'),api('/rest/v1/ic_events?select=*&is_active=eq.true&limit=50'),api('/rest/v1/ic_needs?select=*&status=eq.open&limit=50')]);state.businesses=b||[];state.offers=o||[];state.products=p||[];state.jobs=j||[];state.events=e||[];state.needs=n||[]}catch{state.businesses=demoB;state.offers=demoO}}function render(){nav();let m={home,directory,benefits,deals,products,jobs,needs,events,radar:radarPage,favorites,pro,prospectRadar:()=>proPage('🎯 Radar Prospects','Le moteur professionnel pour trouver de nouveaux clients.','radar'),prospects:()=>proPage('👥 Mes prospects','Vos prospects qualifiés et enregistrés.','prospects'),pipeline:()=>proPage('📌 Suivi commercial / pipeline','Suivez chaque prospect jusqu’à la vente.','pipeline'),opportunities:()=>proPage('📡 Opportunités Pro','Les besoins locaux correspondant à votre activité.','opportunities'),target:()=>proPage('◎ Ma clientèle cible','Définissez vos clients idéaux et votre zone.','target'),myProducts,myBenefits,recruit,campaigns,business};document.getElementById('content').innerHTML=(m[state.page]||home)()}try{state.session=JSON.parse(localStorage.getItem('ic_session')||'null')}catch{}load().then(()=>state.session?afterLogin():render());
</script>
