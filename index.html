<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Deal — Chargement</title>
</head>
<body style="margin:0;background:#07101f;color:#f1f5ff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh">
<div id="loading">Chargement de Signal Deal…</div>
<script>
(async()=>{
  try{
    const source='https://cdn.jsdelivr.net/gh/djerhemiank-source/signal-deal@63494ded7db52428a61d849f1cd6ce35dc337af7/index.html';
    let html=await (await fetch(source,{cache:'no-store'})).text();
    html=html
      .replace('https://buy.stripe.com/test_7sYdRaejI1NqblR8Wh18c00','https://buy.stripe.com/dRm3cx1GE1WK6v30r06Zy00')
      .replace('https://buy.stripe.com/test_3cI3cw2B063G9dJ0pL18c01','https://buy.stripe.com/00w28tbhe58W3iRgpY6Zy01')
      .replace('https://buy.stripe.com/test_3cI9AUb7w4ZCblRb4p18c02','https://buy.stripe.com/6oU28tcli44SaLjgpY6Zy02')
      .replace('Les paiements sont actuellement en environnement Stripe de test : aucun argent réel n’est prélevé.','Paiements réels sécurisés par Stripe. Les abonnements sont renouvelés automatiquement jusqu’à résiliation.')
      .replace('Paiement test validé par Stripe. Activation de votre formule en cours…','Paiement validé par Stripe. Activation de votre formule en cours…')
      .replace("client.from('subscriptions').select('plan,status').eq('user_id',session.user.id).maybeSingle()","client.from('subscriptions').select('plan,status').eq('user_id',session.user.id).eq('livemode',true).maybeSingle()");

    const teaserPatch = String.raw`
<style>
.free-gate-banner{margin:0 0 14px;padding:14px 16px;border:1px solid #315f7d;background:linear-gradient(135deg,#10283d,#0b1d31);border-radius:13px;font-size:12px;line-height:1.55;color:#d9ecff}
.free-gate-banner b{color:#68d5ff}.free-gate-banner .free-price{display:inline-block;margin-left:5px;color:#5be39d;font-weight:900}
.free-preview-tag{border-color:#4a9dc2!important;color:#9fe3ff!important;background:#12304a!important;font-weight:850}
.free-unlock-btn{background:#68d5ff!important;color:#04121c!important;border-color:#68d5ff!important;font-weight:900!important}
.free-commercial-value{margin:9px 0;padding:10px 11px;border:1px solid #285747;background:#0d2822;border-radius:9px;font-size:11px;line-height:1.55;color:#c6efd9}
.free-commercial-value b{color:#5be39d}
</style>
<script>
(function(){
  function enhanceFreeView(){
    const badge=document.getElementById('planBadge');
    const isFree=badge && /Gratuit/i.test(badge.textContent||'');
    const feedEl=document.getElementById('feed');
    if(!feedEl) return;

    let banner=document.getElementById('freeGateBanner');
    if(isFree){
      if(!banner){
        banner=document.createElement('div');
        banner.id='freeGateBanner';
        banner.className='free-gate-banner';
        banner.innerHTML='<b>APERÇU GRATUIT</b> — Vous voyez le type de besoin et son potentiel commercial. <strong>L’acheteur, l’objet exact, la source officielle, le besoin complet et l’échéance restent verrouillés.</strong><span class="free-price">Déblocage dès 9,90 €/mois.</span>';
        feedEl.parentNode.insertBefore(banner,feedEl);
      }

      document.querySelectorAll('#feed .card').forEach(card=>{
        const tagrow=card.querySelector('.tagrow');
        if(tagrow && !tagrow.querySelector('.free-preview-tag')){
          const t=document.createElement('span');t.className='tag free-preview-tag';t.textContent='APERÇU GRATUIT';tagrow.prepend(t);
        }

        const signalBox=card.querySelector('.signal');
        if(signalBox){
          const label=signalBox.querySelector('b');
          if(label) label.textContent='Besoin détecté :';
          const oppId=(card.id||'').replace(/^card-/,'');
          let opp=null;
          try{opp=feed.find(x=>String(x.id)===oppId)}catch(e){}
          if(opp?.signal && !card.querySelector('.free-commercial-value')){
            const v=document.createElement('div');
            v.className='free-commercial-value';
            v.innerHTML='<b>Potentiel commercial</b><br>'+escapeHtml(opp.signal);
            signalBox.insertAdjacentElement('afterend',v);
          }
        }

        card.querySelectorAll('button').forEach(btn=>{
          if((btn.textContent||'').includes('🔒 Source')){
            btn.textContent='🔒 Voir l’acheteur, l’objet exact et la source — 9,90 €';
            btn.classList.add('primary','free-unlock-btn');
          }
        });
      });

      const dealBox=document.querySelector('#dealDay .dealbox');
      const dealActions=document.querySelector('#dealDay .dealbox .actions');
      if(dealBox){
        let top=null;
        try{top=[...feed].sort((a,b)=>(b.score||0)-(a.score||0))[0]}catch(e){}
        if(top?.signal && !dealBox.querySelector('.free-commercial-value')){
          const v=document.createElement('div');
          v.className='free-commercial-value';
          v.innerHTML='<b>Pourquoi cette opportunité peut intéresser un commercial</b><br>'+escapeHtml(top.signal);
          dealActions?.insertAdjacentElement('beforebegin',v);
        }
      }
      if(dealActions && !dealActions.querySelector('.free-unlock-btn')){
        const b=document.createElement('button');
        b.className='primary free-unlock-btn';
        b.textContent='🔒 Débloquer l’acheteur et la source — 9,90 €';
        b.onclick=()=>scrollToPricing();
        dealActions.appendChild(b);
      }
    }else{
      if(banner) banner.remove();
      document.querySelectorAll('.free-preview-tag,.free-commercial-value').forEach(x=>x.remove());
    }
  }
  const obs=new MutationObserver(()=>enhanceFreeView());
  obs.observe(document.documentElement,{subtree:true,childList:true,characterData:true});
  setInterval(enhanceFreeView,1000);
  setTimeout(enhanceFreeView,300);
})();
<\/script>`;
    html=html.replace('</body>',teaserPatch+'\n</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').textContent='Impossible de charger Signal Deal. Actualisez la page dans quelques instants.';
    console.error(e);
  }
})();
</script>
</body>
</html>
