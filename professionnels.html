<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>Signal Deal — Je recherche un professionnel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07101f;--p:#101a2f;--l:#2a3b5e;--t:#f1f5ff;--m:#9eb0cf;--a:#68d5ff;--g:#5be39d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 15% 0,#122143,#07101f 45%);color:var(--t);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:0 18px}header{border-bottom:1px solid var(--l);background:#07101ff2;position:sticky;top:0;z-index:10}.head{min-height:66px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:900;text-decoration:none}.brand b{color:var(--a)}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn,button,input{font:inherit}.btn,button{border:1px solid var(--l);background:#13233e;color:var(--t);padding:10px 13px;border-radius:10px;text-decoration:none;cursor:pointer}.primary{background:var(--a);color:#04121c;border-color:var(--a);font-weight:850}.hero{padding:36px 0 16px}.hero h1{font-size:clamp(32px,6vw,54px);margin:0}.hero h1 span{color:var(--a)}.hero p,.status{color:var(--m);line-height:1.55}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin:12px 0}input{width:100%;background:#081326;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:16px}.name{font-size:18px;font-weight:900}.meta{font-size:10px;color:var(--m);margin-top:4px}.tags,.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:9px;padding:5px 7px;border:1px solid #335273;border-radius:999px;background:#14233d}.desc{font-size:11px;line-height:1.55;background:#0b1830;border-left:3px solid var(--a);padding:10px;border-radius:8px;margin-top:10px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.fact{border:1px solid #263b5b;border-radius:9px;padding:8px;font-size:10px}.fact b{display:block;margin-bottom:2px}.empty{grid-column:1/-1;border:1px dashed var(--l);border-radius:14px;padding:30px;text-align:center;color:var(--m)}@media(max-width:760px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.head{padding:9px 0}}@media(max-width:520px){.filters,.facts{grid-template-columns:1fr}}</style></head><body><header><div class="wrap head"><a class="brand" href="./compte.html">SIGNAL <b>DEAL</b> · JE RECHERCHE</a><div class="nav"><a class="btn" href="./compte.html">Mon compte</a><a class="btn" href="./demande-travaux.html">Déposer un projet</a></div></div></header><main class="wrap"><section class="hero"><h1>Je recherche <span>un professionnel</span></h1><p>Recherchez les professionnels Signal Deal qui ont choisi d’apparaître dans l’annuaire. Filtrez par métier, spécialité ou zone.</p></section><div class="filters"><input id="q" placeholder="Métier ou spécialité : cuisiniste, plombier…"><input id="postal" placeholder="Code postal"><input id="city" placeholder="Ville"><button class="primary" onclick="load()">Rechercher</button></div><div id="status" class="status">Chargement des professionnels…</div><div id="grid" class="grid"></div></main><script>const U='https://eazukvtjxeirbitukueb.supabase.co',K='sb_publishable_OIOSgs39cGT6s34eVuexIA_5bZGmZVj',c=window.supabase.createClient(U,K);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fact(a,b){return b?`<div class="fact"><b>${esc(a)}</b>${esc(b)}</div>`:''}async function load(){const st=document.getElementById('status'),g=document.getElementById('grid');st.textContent='Recherche…';g.innerHTML='';try{const {data,error}=await c.functions.invoke('signal-deal-professional-directory',{body:{query:document.getElementById('q').value.trim(),postal_code:document.getElementById('postal').value.trim(),city:document.getElementById('city').value.trim(),limit:100}});if(error)throw error;if(data?.error)throw new Error(data.error);const a=data.items||[];st.textContent=`${a.length} professionnel(s) trouvé(s)`;if(!a.length){g.innerHTML='<div class="empty">Aucun professionnel Signal Deal n’est encore visible avec ces critères. Vous pouvez déposer votre projet pour recevoir des mises en relation adaptées.</div>';return}g.innerHTML=a.map(x=>`<article class="card"><div class="name">${esc(x.company_name||'Professionnel')}</div><div class="meta">${esc(x.profession||'Professionnel')} · 📍 ${esc(x.postal_code||'')} ${esc(x.city||'')}</div><div class="tags">${(x.specialties||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}${x.rge==='yes'?'<span class="tag">RGE</span>':''}${x.decennial==='yes'?'<span class="tag">Décennale déclarée</span>':''}</div>${x.description?`<div class="desc">${esc(x.description)}</div>`:''}<div class="facts">${fact('Rayon d’intervention',x.service_radius_km?x.service_radius_km+' km':'')}${fact('Expérience',x.years_experience?x.years_experience+' an(s)':'')}${fact('Effectif',x.employees)}${fact('Qualifications',(x.certifications||[]).join(', '))}</div><div class="actions">${x.website?`<a class="btn" href="${esc(x.website)}" target="_blank" rel="noopener">Site web ↗</a>`:''}${x.business_email?`<a class="btn" href="mailto:${encodeURIComponent(x.business_email)}">✉ Écrire</a>`:''}${x.business_phone?`<a class="btn" href="tel:${esc(x.business_phone)}">☎ Appeler</a>`:''}</div></article>`).join('')}catch(e){console.error(e);st.textContent='Impossible de charger l’annuaire pour le moment.';g.innerHTML='<div class="empty">Réessayez dans quelques instants.</div>'}}load();</script></body></html>
