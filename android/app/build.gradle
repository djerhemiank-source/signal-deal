plugins {
    id 'com.android.application'
}

def uploadKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def uploadKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def uploadKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def uploadStorePassword = System.getenv('ANDROID_STORE_PASSWORD')
def uploadSigningReady = uploadKeystorePath && uploadKeyAlias && uploadKeyPassword && uploadStorePassword

android {
    namespace 'fr.signaldeal.app'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.signaldeal.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (uploadSigningReady) {
            release {
                storeFile file(uploadKeystorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
