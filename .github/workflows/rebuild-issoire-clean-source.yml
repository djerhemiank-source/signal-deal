name: Rebuild Issoire Connect Clean Source

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/rebuild-issoire-clean-source.yml
      - issoire-connect/app/v3-data-0.txt
      - issoire-connect/app/v3-data-1.txt
      - issoire-connect/app/v3-data-2.txt
      - issoire-connect/app/v3-data-3.txt
      - issoire-connect/app/*-patch.js
      - issoire-connect/app/pro-edit-patch.js
      - issoire-connect/app/auth-flow-patch-v40.js
      - issoire-connect/app/v40-core-patch.js
      - issoire-connect/app/radar-prospects-mobile-fix-v40.js
      - issoire-connect/app/mobile-pro-services-v40.js
      - issoire-connect/app/legal-v40.js
      - issoire-connect/app/subscription-v32.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct readable V40 source
        shell: bash
        run: |
          set -euo pipefail
          OUT="issoire-connect/app-clean"
          SRC="issoire-connect/app"
          mkdir -p "$OUT"

          node --check "$SRC/pro-edit-patch.js"
          node --check "$SRC/auth-flow-patch-v40.js"
          node --check "$SRC/mobile-pro-services-v40.js"

          cat "$SRC"/v3-data-{0,1,2,3}.txt \
            | tr -d '\r\n\t ' \
            | base64 -d \
            | gzip -d > "$OUT/base.html"

          grep -qi '<!doctype html>\|<html' "$OUT/base.html"
          grep -qi 'Issoire' "$OUT/base.html"
          test "$(wc -c < "$OUT/base.html")" -gt 10000

          FILES=(
            claim-patch.js
            pro-edit-patch.js
            search-patch.js
            admin-full-patch.js
            admin-business-extra-patch.js
            leaflet-safety-patch.js
            directory-patch.js
            resident-classifieds-patch.js
            directory-route-fix.js
            directory-state-patch.js
            public-classifieds-patch.js
            moderation-patch.js
            plans-patch.js
            admin-plan-access-patch.js
            ads-system-patch.js
            local-needs-patch.js
            admin-profile-audit-patch.js
            account-security-patch.js
            auth-flow-patch-v40.js
            push-notifications-patch.js
            member-benefits-patch.js
            subscription-v32.js
            v40-core-patch.js
            radar-prospects-mobile-fix-v40.js
            mobile-pro-services-v40.js
            legal-v40.js
          )

          : > "$OUT/app-v40.bundle.js"
          for f in "${FILES[@]}"; do
            test -s "$SRC/$f"
            printf '\n;/* ===== %s ===== */\n' "$f" >> "$OUT/app-v40.bundle.js"
            cat "$SRC/$f" >> "$OUT/app-v40.bundle.js"
            printf '\n' >> "$OUT/app-v40.bundle.js"
          done

          node --check "$OUT/app-v40.bundle.js"

          python3 - <<'PY'
          from pathlib import Path
          out = Path('issoire-connect/app-clean')
          html = (out/'base.html').read_text(encoding='utf-8')
          marker = '<script src="app-v40.bundle.js?v=40.3-clean"></script>'
          if '</body>' not in html.lower():
              raise SystemExit('Missing </body> in reconstructed HTML')
          pos = html.lower().rfind('</body>')
          html = html[:pos] + marker + html[pos:]
          (out/'index.html').write_text(html, encoding='utf-8')
          PY

          cp "$SRC/manifest.webmanifest" "$OUT/manifest.webmanifest"
          cp "$SRC/icon.svg" "$OUT/icon.svg"

          cat > "$OUT/sw.js" <<'SW'
          const CACHE='issoire-connect-v40-clean-3';
          const CORE=['./','./index.html','./app-v40.bundle.js','./manifest.webmanifest','./icon.svg'];
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET') return;
            event.respondWith(fetch(event.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(event.request,copy));return r;}).catch(()=>caches.match(event.request).then(r=>r||caches.match('./index.html'))));
          });
          SW

          cat > "$OUT/README.txt" <<'TXT'
          Issoire Connect V40 - source consolidee

          Cette version est reconstruite a partir du HTML V3 compresse et regroupe les scripts fonctionnels dans un bundle unique, dans leur ordre d'execution historique.
          Elle sert aussi de solution de repli pour les navigateurs qui ne prennent pas en charge DecompressionStream.

          Fichiers principaux :
          - base.html : HTML V3 decompresse, lisible
          - index.html : HTML lisible chargeant un seul bundle
          - app-v40.bundle.js : bundle V40 consolide
          - sw.js : cache PWA propre a la version clean

          Les correctifs d'authentification, confirmation email, Radar Prospects et services Pro sont inclus dans le bundle.
          TXT

      - name: Validate clean architecture
        shell: bash
        run: |
          set -euo pipefail
          test -s issoire-connect/app-clean/index.html
          test -s issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'app-v40.bundle.js?v=40.3-clean' issoire-connect/app-clean/index.html
          ! grep -q 'v3-data-' issoire-connect/app-clean/index.html
          test "$(grep -o 'app-v40.bundle.js?v=40.3-clean' issoire-connect/app-clean/index.html | wc -l)" -eq 1
          node --check issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'emailRedirectTo' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'resendIcSignupConfirmation' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'openIcProspectRadarV40' issoire-connect/app-clean/app-v40.bundle.js
          echo "Clean V40.3 source validated."

      - name: Upload clean source artifact
        uses: actions/upload-artifact@v4
        with:
          name: issoire-connect-v40-clean-source
          path: issoire-connect/app-clean/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated readable source when allowed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- issoire-connect/app-clean/ && git ls-files --error-unmatch issoire-connect/app-clean/index.html >/dev/null 2>&1; then
            echo 'No generated source change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issoire-connect/app-clean/
          git commit -m 'Generate consolidated Issoire Connect V40.3 clean source'
          if ! git push; then
            echo 'Push not permitted; artifact remains available for manual promotion.'
          fi
