name: Rebuild Issoire Connect Clean Source

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/rebuild-issoire-clean-source.yml
      - issoire-connect/app/*.js
      - issoire-connect/app/v3-data-0.txt
      - issoire-connect/app/v3-data-1.txt
      - issoire-connect/app/v3-data-2.txt
      - issoire-connect/app/v3-data-3.txt
      - issoire-connect/app/manifest.webmanifest
      - issoire-connect/app/icon.svg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct readable V52 source
        shell: bash
        run: |
          set -euo pipefail
          OUT="issoire-connect/app-clean"
          SRC="issoire-connect/app"
          mkdir -p "$OUT"

          FILES=(
            claim-patch.js
            pro-edit-patch.js
            search-patch.js
            admin-full-patch.js
            admin-business-extra-patch.js
            leaflet-safety-patch.js
            directory-patch.js
            resident-classifieds-patch.js
            directory-route-fix.js
            directory-state-patch.js
            public-classifieds-patch.js
            moderation-patch.js
            plans-patch.js
            admin-plan-access-patch.js
            ads-system-patch.js
            local-needs-patch.js
            admin-profile-audit-patch.js
            account-security-patch.js
            auth-flow-patch-v40.js
            push-notifications-patch.js
            member-benefits-patch.js
            subscription-v32.js
            v40-core-patch.js
            radar-prospects-mobile-fix-v40.js
            mobile-pro-services-v40.js
            legal-v40.js
            functional-audit-fix-v41.js
            ui-consolidation-v42.js
            agenda-v43.js
            admin-users-v44.js
            admin-owner-v45.js
            reliability-v46.js
            reviews-messaging-v47-patch.js
            business-modal-v47-fix.js
            transaction-experience-v48.js
            notifications-v49.js
            order-push-v50.js
            agenda-reminders-v51.js
            resident-ads-v52.js
            demo-v52.js
          )

          for f in "${FILES[@]}"; do
            test -s "$SRC/$f"
            node --check "$SRC/$f"
          done

          cat "$SRC"/v3-data-{0,1,2,3}.txt | tr -d '\r\n\t ' | base64 -d | gzip -d > "$OUT/base.html"
          grep -qi '<!doctype html>\|<html' "$OUT/base.html"
          grep -qi 'Issoire' "$OUT/base.html"
          test "$(wc -c < "$OUT/base.html")" -gt 10000

          : > "$OUT/app-v40.bundle.js"
          for f in "${FILES[@]}"; do
            printf '\n;/* ===== %s ===== */\n' "$f" >> "$OUT/app-v40.bundle.js"
            cat "$SRC/$f" >> "$OUT/app-v40.bundle.js"
            printf '\n' >> "$OUT/app-v40.bundle.js"
          done
          node --check "$OUT/app-v40.bundle.js"

          python3 - <<'PY'
          from pathlib import Path
          out=Path('issoire-connect/app-clean')
          html=(out/'base.html').read_text(encoding='utf-8')
          marker='<script src="app-v40.bundle.js?v=52.0-clean"></script>'
          pos=html.lower().rfind('</body>')
          if pos<0: raise SystemExit('Missing </body> in reconstructed HTML')
          (out/'index.html').write_text(html[:pos]+marker+html[pos:],encoding='utf-8')
          PY

          cp "$SRC/manifest.webmanifest" "$OUT/manifest.webmanifest"
          cp "$SRC/icon.svg" "$OUT/icon.svg"

          cat > "$OUT/sw.js" <<'SW'
          'use strict';
          const CACHE='issoire-connect-v52-clean-1';
          const CORE=['./','./index.html','./app-v40.bundle.js','./manifest.webmanifest','./icon.svg'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('issoire-connect-')&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==self.location.origin)return;if(e.request.mode==='navigate'){e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const cp=r.clone();caches.open(CACHE).then(c=>c.put(e.request,cp));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./'))))}else{e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const cp=r.clone();caches.open(CACHE).then(c=>c.put(e.request,cp));return r}).catch(()=>caches.match(e.request)))}});
          self.addEventListener('push',e=>{let d={};try{d=e.data?e.data.json():{}}catch{try{d={body:e.data?.text()||''}}catch{d={}}}const title=d.title||'Issoire Connect';let target='./';try{const u=new URL(d.url||'./',self.location.origin);if(u.origin===self.location.origin)target=u.href}catch{}e.waitUntil(self.registration.showNotification(title,{body:d.body||'',icon:'icon.svg',badge:'icon.svg',tag:d.tag||'issoire-connect',data:{url:target},renotify:false}))});
          self.addEventListener('notificationclick',e=>{e.notification.close();const target=e.notification?.data?.url||new URL('./',self.location.href).href;e.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(list=>{for(const c of list){try{if(new URL(c.url).origin===self.location.origin){c.navigate(target);return c.focus()}}catch{}}return clients.openWindow(target)}))});
          SW

          cat > "$OUT/README.txt" <<'TXT'
          Issoire Connect V52 - source consolidee

          Version lisible et de secours reconstruite depuis le HTML V3 compresse.
          Elle regroupe les modules jusqu'a resident-ads-v52.js et demo-v52.js dans un bundle unique.
          V52 conserve les rappels Agenda V51, corrige la diffusion des campagnes Pro vers les surfaces Habitant et ajoute des profils de demonstration Habitant / Pro 360 sans faux compte en base.
          Le service worker clean gere aussi les Push et notificationclick comme la version principale.
          TXT

      - name: Validate clean V52
        shell: bash
        run: |
          set -euo pipefail
          test -s issoire-connect/app-clean/index.html
          test -s issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'app-v40.bundle.js?v=52.0-clean' issoire-connect/app-clean/index.html
          ! grep -q 'v3-data-' issoire-connect/app-clean/index.html
          node --check issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'window.icV47' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'window.icV48' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'window.icV49' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'window.icV50' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'window.icV51' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'window.icV52Ads' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'window.icV52Demo' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'MODE DÉMO' issoire-connect/app-clean/app-v40.bundle.js
          grep -q 'Voir comme un Habitant' issoire-connect/app-clean/app-v40.bundle.js
          grep -q "notificationclick" issoire-connect/app-clean/sw.js
          echo "Clean V52 source validated."

      - name: Upload clean source artifact
        uses: actions/upload-artifact@v4
        with:
          name: issoire-connect-v52-clean-source
          path: issoire-connect/app-clean/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated readable source when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- issoire-connect/app-clean/ && git ls-files --error-unmatch issoire-connect/app-clean/index.html >/dev/null 2>&1; then
            echo 'No generated source change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issoire-connect/app-clean/
          git commit -m 'Generate consolidated Issoire Connect V52 clean source'
          git push || echo 'Push not permitted; artifact remains available.'
