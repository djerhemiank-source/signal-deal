name: Patch billing manager endpoint

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/patch-billing-manager-endpoint.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace billing function endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements=[
            ('index.html', "signal-deal-billing-portal", "signal-deal-billing-manager"),
            ('tests/root-browser-smoke.mjs', "signal-deal-billing-portal", "signal-deal-billing-manager"),
          ]
          for name,old,new in replacements:
            p=Path(name); s=p.read_text()
            if old not in s: raise SystemExit(f'{old} absent de {name}')
            p.write_text(s.replace(old,new))
          PY
          grep -q "signal-deal-billing-manager" index.html
          grep -q "signal-deal-billing-manager" tests/root-browser-smoke.mjs
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          pathlib.Path('/tmp/root.js').write_text('\n'.join(re.findall(r'<script>([\s\S]*?)</script>',s)))
          PY
          node --check /tmp/root.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-billing-manager-endpoint.yml
          git add index.html tests/root-browser-smoke.mjs
          git commit -m 'Corriger le backend de gestion des abonnements'
          git push
