name: Patch Signal Deal Android Play mode

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-android-play-mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Android Play safe mode
        run: python3 .github/scripts/patch_android_play.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text()
          scripts = '\n'.join(re.findall(r'<script>([\s\S]*?)</script>', html))
          pathlib.Path('/tmp/root.js').write_text(scripts)
          PY
          node --check /tmp/root.js
          node --check tests/root-browser-smoke.mjs
          grep -q "IS_ANDROID_PLAY" index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-android-play-mode.yml .github/scripts/patch_android_play.py
          git add index.html tests/root-browser-smoke.mjs
          git commit -m "Ajouter le mode Android Google Play sécurisé"
          git push
