name: Patch Signal Deal Billing Portal

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/patch-signal-billing-portal.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch root subscription management
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='<div style="margin-top:12px"><a class="btn good" href="#pricing">Changer de formule</a></div><div class="footnote">Paiements réels sécurisés par Stripe. Les abonnements sont renouvelés automatiquement jusqu’à résiliation.</div>'
          new='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn good" href="#pricing">Changer de formule</a><button id="manageSubscriptionBtn" class="btn" onclick="manageSubscription()" style="display:none">Gérer / résilier</button></div><div id="billingMsg" class="msg"></div><div class="footnote">Paiements réels sécurisés par Stripe. Les abonnements sont renouvelés automatiquement jusqu’à résiliation.</div>'
          assert s.count(old)==1, 'subscription controls target not unique'
          s=s.replace(old,new)

          old="function startCheckout(plan){if(!session){alert('Connectez-vous d’abord : Stripe doit savoir quel compte Signal Deal activer.');scrollToAuth();return}const base=CHECKOUT[plan];if(!base)return;const sep=base.includes('?')?'&':'?';location.href=base+sep+'client_reference_id='+encodeURIComponent(session.user.id)+'&prefilled_email='+encodeURIComponent(session.user.email)}"
          new=old+"\nasync function manageSubscription(){if(!session){scrollToAuth();return}const btn=document.getElementById('manageSubscriptionBtn'),msg=document.getElementById('billingMsg');if(btn){btn.disabled=true;btn.textContent='Ouverture…'}if(msg)msg.textContent='';try{const {data,error}=await client.functions.invoke('signal-deal-billing-portal',{body:{}});if(error)throw error;if(!data?.url)throw new Error(data?.error||'Lien Stripe indisponible');location.href=data.url}catch(e){if(msg)msg.textContent='Impossible d’ouvrir la gestion de l’abonnement. Réessayez dans un instant.';if(btn){btn.disabled=false;btn.textContent='Gérer / résilier'}console.error('billing portal',e)}}"
          assert s.count(old)==1, 'checkout target not unique'
          s=s.replace(old,new)

          old="async function loadPlan(){const {data}=await client.from('subscriptions').select('plan,status').eq('user_id',session.user.id).eq('livemode',true).maybeSingle();currentPlan=data?.plan||'free';const names={free:'Gratuit',essential:'Essentiel — 9,90 €',pro:'Pro — 19,90 €',agency:'Agence — 49,90 €'};document.getElementById('planBadge').innerHTML='Formule : <b>'+names[currentPlan]+'</b>';document.getElementById('accountPlan').innerHTML='<b>'+names[currentPlan]+'</b><br>Statut : '+escapeHtml(data?.status||'active');document.getElementById('exportBtn').style.display=['pro','agency'].includes(currentPlan)?'block':'none';if(['pro','agency'].includes(currentPlan)){const r=await client.rpc('get_partner_catalog');partners=r.data||[]}else partners=[];return currentPlan}"
          new="async function loadPlan(){const {data}=await client.from('subscriptions').select('plan,status,cancel_at_period_end,current_period_end').eq('user_id',session.user.id).eq('livemode',true).maybeSingle();currentPlan=data?.plan||'free';const names={free:'Gratuit',essential:'Essentiel — 9,90 €',pro:'Pro — 19,90 €',agency:'Agence — 49,90 €'};document.getElementById('planBadge').innerHTML='Formule : <b>'+names[currentPlan]+'</b>';let account='<b>'+names[currentPlan]+'</b><br>Statut : '+escapeHtml(data?.status||'active');if(data?.cancel_at_period_end&&data?.current_period_end)account+='<br>Résiliation programmée au '+new Date(data.current_period_end).toLocaleDateString('fr-FR');document.getElementById('accountPlan').innerHTML=account;const manage=document.getElementById('manageSubscriptionBtn');if(manage)manage.style.display=data?.plan&&data.plan!=='free'?'inline-block':'none';document.getElementById('exportBtn').style.display=['pro','agency'].includes(currentPlan)?'block':'none';if(['pro','agency'].includes(currentPlan)){const r=await client.rpc('get_partner_catalog');partners=r.data||[]}else partners=[];return currentPlan}"
          assert s.count(old)==1, 'loadPlan target not unique'
          s=s.replace(old,new)

          old="async function enterApp(){if(!session)return;document.getElementById('dashboard').classList.add('show');document.getElementById('authBox').style.display='none';document.getElementById('logoutBtn').style.display='inline-block';document.getElementById('authTop').style.display='none';document.getElementById('userMini').textContent=session.user.email;await loadPlan();await Promise.all([loadFeed(),loadPipeline()]);renderMoneyTool();if(new URLSearchParams(location.search).get('payment')==='success')await waitForActivation();document.getElementById('dashboard').scrollIntoView({behavior:'smooth'})}"
          new="async function enterApp(){if(!session)return;document.getElementById('dashboard').classList.add('show');document.getElementById('authBox').style.display='none';document.getElementById('logoutBtn').style.display='inline-block';document.getElementById('authTop').style.display='none';document.getElementById('userMini').textContent=session.user.email;await loadPlan();await Promise.all([loadFeed(),loadPipeline()]);renderMoneyTool();const params=new URLSearchParams(location.search);if(params.get('payment')==='success')await waitForActivation();else if(params.get('billing')==='return'){const msg=document.getElementById('billingMsg');if(msg)msg.textContent='✓ Gestion Stripe terminée. Votre abonnement affiché ci-dessus est à jour.';history.replaceState({},'',PUBLIC_URL)}document.getElementById('dashboard').scrollIntoView({behavior:'smooth'})}"
          assert s.count(old)==1, 'enterApp target not unique'
          s=s.replace(old,new)

          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          js='\n'.join(re.findall(r'<script>([\s\S]*?)</script>',s))
          pathlib.Path('/tmp/root.js').write_text(js)
          PY
          node --check /tmp/root.js
          grep -q 'manageSubscriptionBtn' index.html
          grep -q "client.functions.invoke('signal-deal-billing-portal'" index.html
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-signal-billing-portal.yml
          git add index.html
          git commit -m 'Ajouter le portail de gestion abonnement Signal Deal'
          git push
