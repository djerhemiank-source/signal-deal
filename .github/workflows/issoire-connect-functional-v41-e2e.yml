name: Issoire Connect Functional V41 E2E
on:
  push:
    branches: ["main"]
    paths:
      - "issoire-connect/app/**"
      - "issoire-connect/app-clean/**"
      - "tests/issoire-connect-functional-v41-e2e.mjs"
      - ".github/workflows/issoire-connect-functional-v41-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V41 syntax
        run: node --check issoire-connect/app/functional-audit-fix-v41.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for public V41
        run: |
          URL='https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html'
          for i in {1..60}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?v41=${GITHUB_SHA}" 2>/dev/null || true)
            if echo "$BODY" | grep -q 'functional-audit-fix-v41.js?v=41.0'; then
              echo 'Public V41 detected.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public V41 was not detected in time.'
          exit 1
      - name: Run full browser functional audit
        env:
          IC_APP: https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html
        run: timeout 240s node tests/issoire-connect-functional-v41-e2e.mjs
