name: Issoire Connect V47 Reviews Messaging E2E
on:
  push:
    branches: ["main"]
    paths:
      - "issoire-connect/app/index.html"
      - "issoire-connect/app/reviews-messaging-v47-patch.js"
      - "issoire-connect/app/business-modal-v47-fix.js"
      - "issoire-connect/app/sw.js"
      - "issoire-connect/app-clean/**"
      - "tests/issoire-connect-v47-reviews-messaging-e2e.mjs"
      - ".github/workflows/issoire-connect-v47-reviews-messaging-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviews-messaging-v47:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V47 feature syntax
        run: |
          node --check issoire-connect/app/reviews-messaging-v47-patch.js
          node --check issoire-connect/app/business-modal-v47-fix.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for public loader containing V47 features
        run: |
          URL='https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html'
          for i in {1..60}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?v47-feature=${GITHUB_SHA}" 2>/dev/null || true)
            if echo "$BODY" | grep -q 'reviews-messaging-v47-patch.js?v=' && echo "$BODY" | grep -q 'business-modal-v47-fix.js?v='; then
              echo 'V47 reviews/messaging features detected in public loader.'
              exit 0
            fi
            sleep 5
          done
          echo 'V47 reviews/messaging features were not detected in public loader in time.'
          exit 1
      - name: Run V47 feature browser E2E
        env:
          IC_APP: https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html
        run: timeout 240s node tests/issoire-connect-v47-reviews-messaging-e2e.mjs
