name: Activate ZoneProspect 360 Suite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-zoneprospect360-suite.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final user-facing corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Main mobile navigation: keep Mon compte directly reachable.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<span id="userMini" class="status hide-sm">Non connecté</span>'
          account='<span id="userMini" class="status hide-sm">Non connecté</span><a class="btn account-link" href="./compte.html">👤 Mon compte</a>'
          if 'class="btn account-link"' not in s:
              if marker not in s: raise SystemExit('main nav anchor not found')
              s=s.replace(marker,account,1)
          if '.account-link{white-space:nowrap}' not in s:
              s=s.replace('.nav{display:flex;gap:8px;align-items:center}', '.nav{display:flex;gap:8px;align-items:center}.account-link{white-space:nowrap}',1)
          s=s.replace('@media(max-width:650px){.wrap{padding:0 14px}', '@media(max-width:650px){.wrap{padding:0 14px}.account-link{padding:9px 10px;font-size:11px}',1)
          p.write_text(s,encoding='utf-8')

          # 4) Any canceled-at-period-end subscription is treated as free immediately in the client.
          for p in [Path('index.html'),Path('prospects.html'),Path('compte.html'),Path('zoneprospect360-suite.js')]:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace(".in('status',['active','trialing']).order", ".in('status',['active','trialing']).eq('cancel_at_period_end',false).order")
              s=s.replace('.in("status",["active","trialing"]).order', '.in("status",["active","trialing"]).eq("cancel_at_period_end",false).order')
              s=s.replace("select('plan,status,updated_at')", "select('plan,status,cancel_at_period_end,updated_at')")
              p.write_text(s,encoding='utf-8')

          # 5) Privacy copy matches the actual paid-subscription access rule.
          p=Path('privacy.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('à un professionnel authentifié que lorsque', 'à un professionnel disposant d’un abonnement actif que lorsque')
          s=s.replace('Un professionnel connecté peut recevoir les coordonnées', 'Un professionnel disposant d’un abonnement actif peut recevoir les coordonnées')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate product
        shell: bash
        run: |
          node --check zoneprospect360-suite.js
          node --test tests/lite-core.test.js
          grep -q '👤 Mon compte' index.html
          grep -q 'account-link' index.html
          grep -q "cancel_at_period_end',false" zoneprospect360-suite.js
          grep -q 'professionnel disposant d’un abonnement actif' privacy.html
          grep -q 'android:label="ZoneProspect 360"' android/app/src/main/AndroidManifest.xml

      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'ZoneProspect 360 Suite'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html prospects.html compte.html privacy.html zoneprospect360-suite.js
          git commit -m 'fix: account navigation privacy and canceled subscription state'
          git push origin HEAD:main
