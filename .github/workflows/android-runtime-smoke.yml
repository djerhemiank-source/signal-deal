name: Smoke Signal Deal Android Runtime

on:
  push:
    branches:
      - main
    paths:
      - android/**
      - .github/workflows/android-runtime-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-deal-android-runtime-smoke-v2
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android emulator API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          AVD_HOME="$RUNNER_TEMP/signal-deal-avd"
          AVD_PATH="$AVD_HOME/signal_deal_api36.avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$AVD_HOME"

          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n signal_deal_api36 \
            -k "system-images;android-36;google_apis;x86_64" \
            -p "$AVD_PATH" \
            --force

          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/signal-deal-avds.txt
          grep -qx 'signal_deal_api36' /tmp/signal-deal-avds.txt

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Start API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          sudo chmod 666 /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" \
            -avd signal_deal_api36 \
            -no-window -no-audio -no-boot-anim \
            -gpu auto \
            -no-snapshot -wipe-data \
            > /tmp/signal-deal-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/signal-deal-emulator.pid

          DEVICE_READY=0
          for i in {1..90}; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before adb became available"
              cat /tmp/signal-deal-emulator.log || true
              exit 1
            fi
            if timeout 5s "$ADB" get-state 2>/dev/null | grep -q '^device$'; then
              DEVICE_READY=1
              break
            fi
            sleep 2
          done
          if [ "$DEVICE_READY" != "1" ]; then
            echo "Emulator was not visible to adb within 180 seconds"
            cat /tmp/signal-deal-emulator.log || true
            exit 1
          fi

          BOOT_READY=0
          for i in {1..120}; do
            BOOT=$(timeout 5s "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOT" = "1" ]; then
              BOOT_READY=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited during Android boot"
              cat /tmp/signal-deal-emulator.log || true
              exit 1
            fi
            sleep 2
          done
          if [ "$BOOT_READY" != "1" ]; then
            echo "Android did not complete boot within 240 seconds"
            cat /tmp/signal-deal-emulator.log || true
            exit 1
          fi
          timeout 5s "$ADB" shell input keyevent 82 || true

      - name: Install and launch Signal Deal
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          "$ADB" shell am start -W -n fr.signaldeal.app/.MainActivity | tee /tmp/activity-start.txt
          grep -q "Status: ok" /tmp/activity-start.txt

          for i in {1..60}; do
            "$ADB" logcat -d -s SignalDeal:I '*:S' > /tmp/signal-deal-app.log || true
            if grep -q 'PAGE_FINISHED https://djerhemiank-source.github.io/signal-deal/' /tmp/signal-deal-app.log; then break; fi
            sleep 2
          done

          grep -q 'PAGE_FINISHED https://djerhemiank-source.github.io/signal-deal/' /tmp/signal-deal-app.log
          ! grep -E 'MAIN_FRAME_ERROR|SSL_ERROR' /tmp/signal-deal-app.log

          PID=$("$ADB" shell pidof -s fr.signaldeal.app | tr -d '\r')
          test -n "$PID"
          "$ADB" shell dumpsys activity activities > /tmp/signal-deal-activity.txt
          grep -E 'mResumedActivity|topResumedActivity' /tmp/signal-deal-activity.txt | grep -q 'fr.signaldeal.app'
          "$ADB" logcat --pid="$PID" -d > /tmp/signal-deal-process.log || true
          ! grep -E 'FATAL EXCEPTION|Process: fr.signaldeal.app.*has died' /tmp/signal-deal-process.log

      - name: Capture Android UI evidence
        if: always()
        shell: bash
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          cp /tmp/activity-start.txt /tmp/signal-deal-activity-start.txt 2>/dev/null || true
          if timeout 5s "$ADB" get-state 2>/dev/null | grep -q '^device$'; then
            timeout 10s "$ADB" exec-out screencap -p > /tmp/signal-deal-android.png || true
            timeout 10s "$ADB" shell uiautomator dump /sdcard/signal-deal-ui.xml || true
            timeout 10s "$ADB" pull /sdcard/signal-deal-ui.xml /tmp/signal-deal-ui.xml || true
            timeout 10s "$ADB" shell dumpsys activity activities > /tmp/signal-deal-activity.txt || true
            timeout 10s "$ADB" logcat -d -s SignalDeal:I '*:S' > /tmp/signal-deal-app.log || true
            timeout 10s "$ADB" logcat -d > /tmp/signal-deal-logcat.txt || true
          else
            echo "No adb device available during evidence capture" > /tmp/signal-deal-no-device.txt
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-deal-android-runtime-evidence
          path: |
            /tmp/signal-deal-android.png
            /tmp/signal-deal-ui.xml
            /tmp/signal-deal-app.log
            /tmp/signal-deal-process.log
            /tmp/signal-deal-activity.txt
            /tmp/signal-deal-logcat.txt
            /tmp/signal-deal-activity-start.txt
            /tmp/signal-deal-emulator.log
            /tmp/signal-deal-emulator.pid
            /tmp/signal-deal-no-device.txt
            /tmp/signal-deal-avds.txt
          if-no-files-found: warn
          retention-days: 14
