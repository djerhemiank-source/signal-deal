name: Issoire Connect V49 Notifications E2E
on:
  push:
    branches: ["main"]
    paths:
      - "issoire-connect/app/notifications-v49.js"
      - "issoire-connect/app/transaction-experience-v48.js"
      - "tests/issoire-connect-v49-notifications-e2e.mjs"
      - ".github/workflows/issoire-connect-v49-notifications-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifications-v49:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V49 syntax
        run: |
          node --check issoire-connect/app/notifications-v49.js
          node --check issoire-connect/app/transaction-experience-v48.js
          node --check tests/issoire-connect-v49-notifications-e2e.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for public loader containing V49
        run: |
          URL='https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html'
          for i in {1..60}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?v49=${GITHUB_SHA}" 2>/dev/null || true)
            if echo "$BODY" | grep -q 'notifications-v49.js?v=' && echo "$BODY" | grep -q 'transaction-experience-v48.js?v='; then
              echo 'Public loader contains V49.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public V49 feature was not detected in time.'
          exit 1
      - name: Run V49 browser E2E
        env:
          IC_APP: https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html
        run: timeout 240s node tests/issoire-connect-v49-notifications-e2e.mjs
