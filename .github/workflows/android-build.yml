name: Build Signal Deal Android

on:
  push:
    branches:
      - main
    paths:
      - android/**
      - .github/workflows/android-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Android project configuration
        run: |
          grep -q "compileSdk 36" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q "applicationId 'fr.signaldeal.app'" android/app/build.gradle
          grep -q "usesCleartextTraffic=\"false\"" android/app/src/main/AndroidManifest.xml
          grep -q "MIXED_CONTENT_NEVER_ALLOW" android/app/src/main/java/fr/signaldeal/app/MainActivity.java
          grep -q "SignalDealAndroidPlay" android/app/src/main/java/fr/signaldeal/app/MainActivity.java

      - name: Build debug APK and release AAB
        working-directory: android
        run: gradle --no-daemon --stacktrace clean assembleDebug bundleRelease

      - name: Verify APK target SDK and package
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/signal-deal-badging.txt
          grep -q "package: name='fr.signaldeal.app'" /tmp/signal-deal-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/signal-deal-badging.txt
          grep -q "sdkVersion:'26'" /tmp/signal-deal-badging.txt
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-deal-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: signal-deal-android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
