name: Build ZoneProspect 360 Android

on:
  push:
    branches:
      - main
    paths:
      - android/**
      - .github/workflows/android-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
      EXPECTED_UPLOAD_CERT_SHA256: 5BC53CF9DB919AE3EAE39E2150EF932A68F5BD9B60554D51C44F8A5B0611D5B6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Android project configuration
        run: |
          grep -q "compileSdk 36" android/app/build.gradle
          grep -q "minSdk 23" android/app/build.gradle
          grep -q "targetSdk 36" android/app/build.gradle
          grep -q "versionCode 2" android/app/build.gradle
          grep -q "versionName '1.0.1-universal'" android/app/build.gradle
          grep -q "applicationId 'fr.signaldeal.app'" android/app/build.gradle
          grep -q "applicationIdSuffix '.zoneprospect360'" android/app/build.gradle
          grep -q "android:label=\"ZoneProspect 360\"" android/app/src/main/AndroidManifest.xml
          grep -q "android:icon=\"@drawable/ic_launcher_foreground\"" android/app/src/main/AndroidManifest.xml
          grep -q "usesCleartextTraffic=\"false\"" android/app/src/main/AndroidManifest.xml
          grep -q "MIXED_CONTENT_NEVER_ALLOW" android/app/src/main/java/fr/signaldeal/app/MainActivity.java

      - name: Build universal test APK and unsigned release AAB
        working-directory: android
        run: gradle --no-daemon --stacktrace clean assembleDebug bundleRelease

      - name: Verify APK label SDK package and version
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/zoneprospect360-badging.txt
          grep -q "package: name='fr.signaldeal.app.zoneprospect360' versionCode='2' versionName='1.0.1-universal-test'" /tmp/zoneprospect360-badging.txt
          grep -q "application-label:'ZoneProspect 360'" /tmp/zoneprospect360-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/zoneprospect360-badging.txt
          grep -q "sdkVersion:'23'" /tmp/zoneprospect360-badging.txt
          cp "$AAB" /tmp/zoneprospect360-release-unsigned.aab

      - name: Upload directly installable universal APK
        uses: actions/upload-artifact@v4
        with:
          name: zoneprospect360-android-universal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: zoneprospect360-android-release-aab-unsigned
          path: /tmp/zoneprospect360-release-unsigned.aab
          if-no-files-found: error
          retention-days: 14

      - name: Build signed Play upload AAB when secrets exist
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/zoneprospect360-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          ACTUAL_CERT_SHA256=$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_UPLOAD_CERT_SHA256"

          export ANDROID_KEYSTORE_PATH="$KEYSTORE"
          cd android
          gradle --no-daemon --stacktrace bundleRelease
          cd ..
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          cp "$AAB" /tmp/zoneprospect360-release-signed.aab
          rm -f "$KEYSTORE"

      - name: Upload signed Play AAB
        if: env.HAS_ANDROID_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zoneprospect360-android-release-aab-signed
          path: /tmp/zoneprospect360-release-signed.aab
          if-no-files-found: error
          retention-days: 14
