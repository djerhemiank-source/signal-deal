name: Check Issoire Connect
on:
  push:
    branches: ["main","issoire-connect-launch"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: |
          test -f issoire-connect/index.html
          test -f issoire-connect/app/index.html
          test -f issoire-connect/app/manifest.webmanifest
          test -f issoire-connect/app/sw.js
          test -f issoire-connect/app/claim-patch.js
          test -f issoire-connect/app/pro-edit-patch.js
          test -f issoire-connect/app/search-patch.js
          test -f issoire-connect/app/admin-full-patch.js
          test -f issoire-connect/app/admin-business-extra-patch.js
          test -f issoire-connect/app/leaflet-safety-patch.js
          test -f issoire-connect/app/directory-patch.js
          test -f issoire-connect/app/resident-classifieds-patch.js
          test -f issoire-connect/app/directory-route-fix.js
          test -f issoire-connect/app/public-classifieds-patch.js
          test -f issoire-connect/app/v3-data-0.txt
          test -f issoire-connect/app/v3-data-1.txt
          test -f issoire-connect/app/v3-data-2.txt
          test -f issoire-connect/app/v3-data-3.txt
          node -e "JSON.parse(require('fs').readFileSync('issoire-connect/app/manifest.webmanifest','utf8'))"
          node --check issoire-connect/app/claim-patch.js
          node --check issoire-connect/app/pro-edit-patch.js
          node --check issoire-connect/app/search-patch.js
          node --check issoire-connect/app/admin-full-patch.js
          node --check issoire-connect/app/admin-business-extra-patch.js
          node --check issoire-connect/app/leaflet-safety-patch.js
          node --check issoire-connect/app/directory-patch.js
          node --check issoire-connect/app/resident-classifieds-patch.js
          node --check issoire-connect/app/directory-route-fix.js
          node --check issoire-connect/app/public-classifieds-patch.js
          grep -q "PHOTO_BUCKET='ic-classifieds'" issoire-connect/app/resident-classifieds-patch.js
          grep -q "storage.from(PHOTO_BUCKET).upload" issoire-connect/app/resident-classifieds-patch.js
          grep -q "af_latitude" issoire-connect/app/admin-business-extra-patch.js
          grep -q "afx_mon" issoire-connect/app/admin-business-extra-patch.js
          grep -q "admin-business-extra-patch.js?v=20" issoire-connect/app/index.html
          grep -q "directory-route-fix.js?v=20" issoire-connect/app/index.html
          grep -q "resident-classifieds-patch.js?v=20" issoire-connect/app/index.html
          grep -q "public-classifieds-patch.js?v=20" issoire-connect/app/index.html
          grep -q "issoire-connect-v20-full" issoire-connect/app/sw.js
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('issoire-connect/app/index.html').read_text()
          js='\n'.join(re.findall(r'<script>([\s\S]*?)</script>',s))
          pathlib.Path('/tmp/ic.js').write_text(js)
          PY
          node --check /tmp/ic.js
          test $(wc -c < issoire-connect/index.html) -lt 30000
          test $(wc -c < issoire-connect/app/index.html) -lt 30000
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ic-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/issoire-connect/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/ic-http.log; exit 1
      - name: Chromium smoke test local V20
        run: node tests/issoire-connect-smoke.mjs
      - name: Wait for public GitHub Pages V20 loader
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          URL='https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html'
          for i in {1..60}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?deploy=${GITHUB_SHA}" 2>/dev/null || true)
            if echo "$BODY" | grep -q 'admin-business-extra-patch.js?v=20' && echo "$BODY" | grep -q 'directory-route-fix.js?v=20' && echo "$BODY" | grep -q 'resident-classifieds-patch.js?v=20'; then
              echo 'Issoire Connect V20 is live.'
              exit 0
            fi
            echo "Waiting for GitHub Pages V20 ($i/60)..."
            sleep 5
          done
          echo 'The V20 loader did not appear within 5 minutes.'
          exit 1
      - name: Chromium smoke test public V20
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IC_BASE: https://djerhemiank-source.github.io/signal-deal/issoire-connect/
        run: node tests/issoire-connect-smoke.mjs
