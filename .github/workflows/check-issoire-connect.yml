name: Check Issoire Connect
on:
  push:
    branches: ["main","issoire-connect-launch"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static V51 validation
        shell: bash
        run: |
          set -euo pipefail
          for f in issoire-connect/index.html issoire-connect/mentions-legales.html issoire-connect/confidentialite.html issoire-connect/cgu.html issoire-connect/cgv-pro.html issoire-connect/app/index.html issoire-connect/app/manifest.webmanifest issoire-connect/app/sw.js; do test -f "$f"; done
          for f in issoire-connect/app/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('issoire-connect/app/manifest.webmanifest','utf8'))"
          for f in v3-data-0.txt v3-data-1.txt v3-data-2.txt v3-data-3.txt; do test -s "issoire-connect/app/$f"; done

          grep -q 'Pro Local' issoire-connect/app/subscription-v32.js
          grep -q '4,99 € / mois' issoire-connect/app/subscription-v32.js
          grep -q 'Pro 360' issoire-connect/app/subscription-v32.js
          grep -q '19,99 € / mois' issoire-connect/app/subscription-v32.js
          ! grep -q '9,99 €' issoire-connect/index.html
          grep -q 'const RADII=\[1,5,10,20,50\]' issoire-connect/app/local-needs-patch.js
          grep -q 'resendIcSignupConfirmation' issoire-connect/app/auth-flow-patch-v40.js
          grep -q 'window.icV46Reliability' issoire-connect/app/reliability-v46.js
          grep -q 'window.icV47' issoire-connect/app/reviews-messaging-v47-patch.js
          grep -q 'window.icV48' issoire-connect/app/transaction-experience-v48.js
          grep -q 'window.icV49' issoire-connect/app/notifications-v49.js
          grep -q 'window.icV50' issoire-connect/app/order-push-v50.js
          grep -q 'window.icV51' issoire-connect/app/agenda-reminders-v51.js
          grep -q 'reminder_minutes' issoire-connect/app/agenda-reminders-v51.js
          grep -q 'notification=agenda' issoire-connect/app/agenda-reminders-v51.js
          grep -q 'agenda-reminders-v51.js?v=51.0' issoire-connect/app/index.html
          grep -q 'order-push-v50.js?v=51.0' issoire-connect/app/index.html
          grep -q 'notifications-v49.js?v=51.0' issoire-connect/app/index.html
          grep -q 'issoire-connect-v51-agenda-reminders-1' issoire-connect/app/sw.js
          grep -q 'agenda-reminders-v51.js' issoire-connect/app/sw.js
          grep -q "addEventListener('push'" issoire-connect/app/sw.js
          grep -q 'notificationclick' issoire-connect/app/sw.js
          grep -q 'app-clean/index.html' issoire-connect/app/index.html

          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('issoire-connect/app/index.html').read_text()
          js='\n'.join(re.findall(r'<script>([\s\S]*?)</script>',s))
          pathlib.Path('/tmp/ic-loader.js').write_text(js)
          PY
          node --check /tmp/ic-loader.js
          test "$(wc -c < issoire-connect/app/index.html)" -lt 32000

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ic-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/issoire-connect/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/ic-http.log; exit 1

      - name: Chromium smoke test local
        run: node tests/issoire-connect-smoke.mjs

      - name: Wait for public GitHub Pages V51 loader
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          URL='https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html'
          for i in {1..60}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?deploy=${GITHUB_SHA}" 2>/dev/null || true)
            if echo "$BODY" | grep -q 'agenda-reminders-v51.js?v=51.0' && echo "$BODY" | grep -q 'order-push-v50.js?v=51.0'; then
              echo 'Issoire Connect V51 loader is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Public V51 was not detected in time.'
          exit 1

      - name: Chromium smoke test public
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IC_BASE: https://djerhemiank-source.github.io/signal-deal/issoire-connect/
        run: node tests/issoire-connect-smoke.mjs
