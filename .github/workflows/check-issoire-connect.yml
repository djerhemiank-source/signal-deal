name: Check Issoire Connect
on:
  push:
    branches: ["main","issoire-connect-launch"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: |
          test -f issoire-connect/index.html
          test -f issoire-connect/app/index.html
          test -f issoire-connect/app/manifest.webmanifest
          test -f issoire-connect/app/sw.js
          for f in claim-patch.js pro-edit-patch.js search-patch.js admin-full-patch.js admin-business-extra-patch.js leaflet-safety-patch.js directory-patch.js resident-classifieds-patch.js directory-route-fix.js directory-state-patch.js public-classifieds-patch.js moderation-patch.js plans-patch.js admin-plan-access-patch.js ads-system-patch.js local-needs-patch.js admin-profile-audit-patch.js account-security-patch.js push-notifications-patch.js subscription-v32.js; do test -f "issoire-connect/app/$f"; node --check "issoire-connect/app/$f"; done
          for f in v3-data-0.txt v3-data-1.txt v3-data-2.txt v3-data-3.txt; do test -f "issoire-connect/app/$f"; done
          node -e "JSON.parse(require('fs').readFileSync('issoire-connect/app/manifest.webmanifest','utf8'))"
          grep -q "PHOTO_BUCKET='ic-classifieds'" issoire-connect/app/resident-classifieds-patch.js
          grep -q "openReportContent" issoire-connect/app/moderation-patch.js
          grep -q "openIcPlans" issoire-connect/app/plans-patch.js
          grep -q "Pro Local" issoire-connect/app/subscription-v32.js
          grep -q "4,99 € / mois" issoire-connect/app/subscription-v32.js
          grep -q "Pro 360" issoire-connect/app/subscription-v32.js
          grep -q "19,99 € / mois" issoire-connect/app/subscription-v32.js
          ! grep -q "9,99 €" issoire-connect/index.html
          grep -q "icAdminHasAllPlans" issoire-connect/app/admin-plan-access-patch.js
          grep -q "icDirectoryPersistentState" issoire-connect/app/directory-state-patch.js
          grep -q "ic_track_ad_event" issoire-connect/app/ads-system-patch.js
          grep -q "ic_ad_campaign_stats" issoire-connect/app/ads-system-patch.js
          grep -q "openIcNeedRequest" issoire-connect/app/local-needs-patch.js
          grep -q "ic_needs_for_business" issoire-connect/app/local-needs-patch.js
          grep -q "ic_reply_to_need" issoire-connect/app/local-needs-patch.js
          grep -q "Tous les forfaits sont inclus" issoire-connect/app/admin-profile-audit-patch.js
          grep -q "openIcAdminAudit" issoire-connect/app/admin-profile-audit-patch.js
          grep -q "openIcChangePassword" issoire-connect/app/account-security-patch.js
          grep -q "openIcPasswordReset" issoire-connect/app/account-security-patch.js
          grep -q "ic-delete-account" issoire-connect/app/account-security-patch.js
          grep -q "ic_webpush_public_key" issoire-connect/app/push-notifications-patch.js
          grep -q "ic_upsert_push_subscription" issoire-connect/app/push-notifications-patch.js
          grep -q "ic-test-push" issoire-connect/app/push-notifications-patch.js
          grep -q "addEventListener('push'" issoire-connect/app/sw.js
          grep -q "notificationclick" issoire-connect/app/sw.js
          grep -q "local-needs-patch.js?v=32" issoire-connect/app/index.html
          grep -q "ads-system-patch.js?v=32" issoire-connect/app/index.html
          grep -q "plans-patch.js?v=32" issoire-connect/app/index.html
          grep -q "subscription-v32.js?v=32" issoire-connect/app/index.html
          grep -q "4,99 €" issoire-connect/index.html
          grep -q "19,99 €" issoire-connect/index.html
          grep -q "Deux abonnements Pro" issoire-connect/index.html
          grep -q "Paiements encore en mode test" issoire-connect/index.html
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('issoire-connect/app/index.html').read_text()
          js='\n'.join(re.findall(r'<script>([\s\S]*?)</script>',s))
          pathlib.Path('/tmp/ic.js').write_text(js)
          PY
          node --check /tmp/ic.js
          test $(wc -c < issoire-connect/index.html) -lt 30000
          test $(wc -c < issoire-connect/app/index.html) -lt 30000
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ic-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/issoire-connect/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/ic-http.log; exit 1
      - name: Chromium smoke test local
        run: node tests/issoire-connect-smoke.mjs
      - name: Wait for public GitHub Pages V32 loader
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          URL='https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html'
          for i in {1..60}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?deploy=${GITHUB_SHA}" 2>/dev/null || true)
            if echo "$BODY" | grep -q 'plans-patch.js?v=32' && echo "$BODY" | grep -q 'subscription-v32.js?v=32'; then
              echo 'Issoire Connect V32 is live.'
              exit 0
            fi
            echo "Waiting for GitHub Pages V32 ($i/60)..."
            sleep 5
          done
          echo 'The V32 loader did not appear within 5 minutes.'
          exit 1
      - name: Chromium smoke test public
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IC_BASE: https://djerhemiank-source.github.io/signal-deal/issoire-connect/
        run: node tests/issoire-connect-smoke.mjs
