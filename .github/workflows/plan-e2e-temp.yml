name: Temporary Issoire Connect Plan E2E
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  connected-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for public V23
        run: |
          URL='https://djerhemiank-source.github.io/signal-deal/issoire-connect/app/index.html'
          for i in {1..60}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "$URL?plan-e2e=${GITHUB_SHA}" 2>/dev/null || true)
            if echo "$BODY" | grep -q 'plans-patch.js?v=23'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Connected Essential Pro Pro+ E2E
        run: node tests/issoire-connect-plan-e2e-temp.mjs
